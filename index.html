<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>ELITE 3K</title>
<style>
:root{
  --cy:#63e6f2; --cyd:#1e6b74; --am:#ffb347; --rd:#ff5470; --gn:#7dff9b;
  --mg:#e070ff; --bg:#000;
  --glow:0 0 6px rgba(99,230,242,.8),0 0 18px rgba(99,230,242,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);touch-action:none;overscroll-behavior:none;}
body{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--cy);
  -webkit-text-size-adjust:100%;}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;}
.hidden{display:none !important;}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#topline{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-size:clamp(10px,1.6vmin,14px);letter-spacing:.15em;color:var(--cyd);white-space:nowrap;
  text-shadow:0 0 8px rgba(99,230,242,.3);}
#topline b{color:var(--cy);}
#msgs{position:absolute;top:calc(28px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(80vw,560px);text-align:center;font-size:clamp(11px,1.9vmin,16px);letter-spacing:.1em;}
#msgs div{text-shadow:var(--glow);margin-bottom:2px;transition:opacity .5s;}
#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:102px;height:102px;opacity:.85;}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:var(--cy);box-shadow:var(--glow);}
#crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-1px);
  -webkit-mask:linear-gradient(#000 0 24%,transparent 24% 76%,#000 76%);mask:linear-gradient(#000 0 24%,transparent 24% 76%,#000 76%);}
#crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-1px);
  -webkit-mask:linear-gradient(90deg,#000 0 24%,transparent 24% 76%,#000 76%);mask:linear-gradient(90deg,#000 0 24%,transparent 24% 76%,#000 76%);}
#lockbox{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);
  border:1px solid var(--rd);box-shadow:0 0 10px rgba(255,84,112,.7);opacity:0;}
#lockbox.locking{opacity:.6;border-style:dashed;border-color:var(--am);}
#lockbox.locked{opacity:1;}
#hyperct{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);
  font-size:clamp(28px,8vmin,64px);color:var(--am);text-shadow:0 0 18px rgba(255,179,71,.8);letter-spacing:.2em;}

/* bottom console */
#console{position:absolute;left:50%;bottom:calc(4px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;align-items:flex-end;gap:clamp(4px,1vw,14px);}
.gaugecol{display:flex;flex-direction:column;gap:3px;width:clamp(84px,13vw,150px);}
.gauge{display:flex;align-items:center;gap:4px;font-size:clamp(7px,1.15vmin,10px);letter-spacing:.08em;}
.gauge label{width:2.4em;color:var(--cyd);text-align:right;flex:none;}
.bar{flex:1;height:clamp(5px,.9vmin,8px);border:1px solid var(--cyd);position:relative;background:rgba(30,107,116,.12);}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--cy);box-shadow:0 0 6px rgba(99,230,242,.7);}
.bar.amber i{background:var(--am);box-shadow:0 0 6px rgba(255,179,71,.7);}
.bar.red i{background:var(--rd);box-shadow:0 0 6px rgba(255,84,112,.7);}
.bar.seg{display:flex;gap:2px;border:none;background:none;}
.bar.seg s{flex:1;border:1px solid var(--cyd);position:relative;background:rgba(30,107,116,.12);text-decoration:none;}
.bar.seg s i{position:absolute;inset:0;background:var(--cy);box-shadow:0 0 6px rgba(99,230,242,.7);}
#scanner{width:clamp(190px,34vw,340px);height:auto;display:block;
  background:rgba(0,10,14,.55);border-radius:12px;}
#mslrow{display:flex;gap:3px;justify-content:center;font-size:clamp(8px,1.2vmin,11px);}
#mslrow span{width:10px;height:10px;border:1px solid var(--gn);background:rgba(125,255,155,.5);box-shadow:0 0 5px rgba(125,255,155,.6);}
#mslrow span.empty{background:none;box-shadow:none;border-color:var(--cyd);}
#mslrow span.armed{background:var(--rd);border-color:var(--rd);box-shadow:0 0 6px rgba(255,84,112,.8);}
#compass{width:clamp(44px,6vw,64px);height:auto;display:block;margin:0 auto 2px;}
#warnrow{text-align:center;font-size:clamp(8px,1.2vmin,11px);color:var(--rd);letter-spacing:.1em;min-height:1.2em;
  text-shadow:0 0 8px rgba(255,84,112,.6);}

#flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,84,112,.0),rgba(255,84,112,.55));opacity:0;z-index:12;}
#cockpit{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;
  background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 62%,rgba(0,8,12,.55) 100%);}
#cockpit path{stroke:rgba(99,230,242,.14);stroke-width:2;fill:none;vector-effect:non-scaling-stroke;}
#cockpit path.inner{stroke:rgba(99,230,242,.07);}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s;z-index:60;}

/* ---------- touch controls ---------- */
#touch{position:fixed;inset:0;z-index:20;pointer-events:none;}
body.notouch #touch{display:none;}
#stickzone{position:absolute;left:0;bottom:0;width:44%;height:62%;pointer-events:auto;}
#stickbase{position:absolute;width:110px;height:110px;border:1px solid rgba(99,230,242,.5);border-radius:50%;
  box-shadow:inset 0 0 18px rgba(99,230,242,.15),0 0 12px rgba(99,230,242,.2);opacity:0;transform:translate(-50%,-50%);}
#sticknub{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(99,230,242,.25);
  border:1px solid var(--cy);box-shadow:0 0 12px rgba(99,230,242,.5);opacity:0;transform:translate(-50%,-50%);}
#throttle{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
  width:44px;height:min(34vh,240px);border:1px solid var(--cyd);border-radius:8px;pointer-events:auto;
  background:rgba(30,107,116,.12);}
#throttle i{position:absolute;left:0;right:0;bottom:0;height:30%;background:rgba(99,230,242,.3);border-top:2px solid var(--cy);
  box-shadow:0 0 10px rgba(99,230,242,.4);border-radius:0 0 7px 7px;}
#throttle::after{content:'THR';position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--cyd);}
#firebtn{position:absolute;right:calc(72px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));
  width:clamp(64px,10vmin,84px);height:clamp(64px,10vmin,84px);border-radius:50%;border:1px solid var(--rd);
  color:var(--rd);font-size:11px;letter-spacing:.15em;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  background:rgba(255,84,112,.12);box-shadow:0 0 14px rgba(255,84,112,.3),inset 0 0 14px rgba(255,84,112,.12);}
#firebtn:active{background:rgba(255,84,112,.4);}
#actbtns{position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(6px + env(safe-area-inset-right));
  display:flex;flex-wrap:wrap;width:124px;gap:6px;justify-content:flex-end;pointer-events:auto;}
.abtn{min-width:52px;padding:9px 8px;border:1px solid var(--cyd);color:var(--cy);font-size:10px;letter-spacing:.12em;
  text-align:center;background:rgba(0,10,12,.55);border-radius:4px;font-family:inherit;}
.abtn:active,.abtn.on{background:rgba(99,230,242,.25);border-color:var(--cy);box-shadow:0 0 10px rgba(99,230,242,.4);}
.abtn.warn{color:var(--am);border-color:#7a5a2a;}
.abtn[disabled]{opacity:.3;}

/* ---------- generic buttons / overlays ---------- */
button{font-family:inherit;cursor:pointer;}
.nbtn{display:inline-block;padding:12px 22px;border:1px solid var(--cy);color:var(--cy);background:rgba(99,230,242,.06);
  font-size:clamp(12px,2vmin,16px);letter-spacing:.2em;text-shadow:var(--glow);border-radius:3px;}
.nbtn:active{background:rgba(99,230,242,.28);}
.nbtn.amber{color:var(--am);border-color:var(--am);text-shadow:0 0 8px rgba(255,179,71,.6);}
.nbtn.red{color:var(--rd);border-color:var(--rd);text-shadow:0 0 8px rgba(255,84,112,.6);}
.nbtn.small{padding:7px 12px;font-size:clamp(10px,1.6vmin,13px);}

#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:radial-gradient(ellipse at 50% 60%,rgba(10,30,40,.25),rgba(0,0,0,.72));text-align:center;
  padding:20px;}
#title h1{font-size:clamp(54px,16vmin,130px);letter-spacing:.32em;text-indent:.32em;color:var(--cy);
  text-shadow:0 0 12px rgba(99,230,242,.9),0 0 42px rgba(99,230,242,.5),0 0 90px rgba(99,230,242,.3);font-weight:400;}
#title .sub{color:var(--cyd);letter-spacing:.4em;font-size:clamp(10px,2vmin,15px);margin-top:-12px;}
#title .foot{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));font-size:10px;color:#1c4a50;letter-spacing:.1em;line-height:1.7;}
#nameentry input{background:rgba(0,20,24,.8);border:1px solid var(--cy);color:var(--cy);font-family:inherit;
  font-size:18px;letter-spacing:.2em;padding:10px 14px;text-align:center;text-transform:uppercase;width:min(300px,70vw);outline:none;}

#overlay{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.78);backdrop-filter:blur(2px);}
#overlay .panel{max-width:min(560px,92vw);max-height:86vh;overflow-y:auto;border:1px solid var(--cyd);
  background:rgba(0,8,10,.9);padding:22px 26px;box-shadow:0 0 30px rgba(99,230,242,.15);}
#overlay h2{color:var(--am);letter-spacing:.25em;font-size:clamp(15px,2.6vmin,20px);margin-bottom:14px;text-align:center;
  text-shadow:0 0 10px rgba(255,179,71,.5);}
#overlay p,#overlay li{font-size:clamp(11px,1.8vmin,14px);line-height:1.8;color:var(--cy);}
#overlay .dim{color:var(--cyd);}
#overlay .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
kbd{border:1px solid var(--cyd);padding:1px 6px;border-radius:3px;color:var(--am);font-family:inherit;font-size:.9em;}

/* ---------- docked station UI ---------- */
#docked{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:
  linear-gradient(rgba(0,6,8,.88),rgba(0,6,8,.88));
  padding:calc(4px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));}
#dockhead{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px 4px;
  border-bottom:1px solid var(--cyd);flex-wrap:wrap;gap:4px;}
#dockhead .stn{color:var(--am);letter-spacing:.2em;font-size:clamp(13px,2.4vmin,19px);text-shadow:0 0 10px rgba(255,179,71,.4);}
#dockhead .cr{font-size:clamp(11px,2vmin,15px);letter-spacing:.1em;}
#tabs{display:flex;gap:4px;padding:6px 4px;overflow-x:auto;flex:none;scrollbar-width:none;}
#tabs::-webkit-scrollbar{display:none;}
#tabs button{flex:1;min-width:74px;padding:10px 6px;background:rgba(30,107,116,.1);border:1px solid var(--cyd);
  color:var(--cyd);font-size:clamp(10px,1.7vmin,13px);letter-spacing:.14em;border-radius:3px;}
#tabs button.on{color:var(--cy);border-color:var(--cy);background:rgba(99,230,242,.14);box-shadow:0 0 10px rgba(99,230,242,.3);text-shadow:var(--glow);}
#tabs button.launch{color:var(--gn);border-color:#2a7a44;}
#panel{flex:1;overflow-y:auto;padding:10px 8px 20px;-webkit-overflow-scrolling:touch;}
#panel h3{color:var(--am);letter-spacing:.2em;font-size:clamp(12px,2vmin,15px);margin:8px 0 10px;text-shadow:0 0 8px rgba(255,179,71,.4);}
#panel .note{color:var(--cyd);font-size:clamp(10px,1.6vmin,12px);margin:6px 0;line-height:1.6;}
table.mkt{width:100%;border-collapse:collapse;font-size:clamp(10px,1.8vmin,14px);}
table.mkt th{color:var(--cyd);font-weight:400;letter-spacing:.1em;text-align:right;padding:4px 6px;border-bottom:1px solid var(--cyd);font-size:.85em;}
table.mkt th:first-child,table.mkt td:first-child{text-align:left;}
table.mkt td{padding:6px;text-align:right;border-bottom:1px solid rgba(30,107,116,.35);}
table.mkt td.ill{color:var(--rd);}
table.mkt .tbtn{padding:7px 10px;border:1px solid var(--cyd);background:rgba(30,107,116,.12);color:var(--cy);
  font-size:.9em;border-radius:3px;margin-left:4px;}
table.mkt .tbtn:active{background:rgba(99,230,242,.3);}
table.mkt .tbtn[disabled]{opacity:.25;}
.eqrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 6px;border-bottom:1px solid rgba(30,107,116,.35);
  font-size:clamp(11px,1.9vmin,14px);}
.eqrow .nm{flex:1;}
.eqrow .pr{color:var(--am);}
.eqrow small{display:block;color:var(--cyd);font-size:.8em;margin-top:2px;letter-spacing:.03em;}
.owned{color:var(--gn);}
#chart{width:100%;display:block;border:1px solid var(--cyd);background:rgba(0,10,12,.5);touch-action:none;}
#sysinfo{font-size:clamp(11px,1.9vmin,14px);line-height:1.9;padding:8px 4px;}
#sysinfo b{color:var(--am);letter-spacing:.15em;}
.msrow{border:1px solid rgba(30,107,116,.5);padding:10px;margin-bottom:10px;font-size:clamp(11px,1.8vmin,13px);line-height:1.7;}
.msrow .rw{color:var(--am);}
.danger{color:var(--rd);}
.statgrid{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:clamp(11px,1.9vmin,14px);line-height:1.7;}
.statgrid dt{color:var(--cyd);letter-spacing:.1em;}
.togglerow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(30,107,116,.35);font-size:clamp(11px,1.8vmin,13px);}
textarea#savecode{width:100%;height:70px;background:rgba(0,20,24,.8);color:var(--cy);border:1px solid var(--cyd);
  font-family:inherit;font-size:10px;padding:6px;-webkit-user-select:text;user-select:text;}
.slotrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid rgba(30,107,116,.35);font-size:clamp(11px,1.8vmin,13px);}
.slotrow .meta{color:var(--cyd);font-size:.85em;}

@media (orientation:portrait){
  #console{gap:3px;}
  #scanner{width:min(44vw,240px);}
  #firebtn{bottom:calc(20vh + env(safe-area-inset-bottom));}
}
</style>
</head>

  </div>
  <div class="foot">TOUCH: LEFT STICK STEER · RIGHT SLIDER THROTTLE · FIRE TO SHOOT<br>
  KEYS: WASD/ARROWS STEER · R/F THROTTLE · SPACE FIRE · H HYPERSPACE · P PAUSE/HELP</div>
</div>

<div id="overlay" class="hidden"><div class="panel" id="ovpanel"></div></div>
<div id="fade"></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ConvexGeometry} from 'three/addons/geometries/ConvexGeometry.js';

/* ============================================================
   ELITE 3K — a single-file tribute to Elite (1984)
   vanilla JS + three.js · neon wireframe · mobile + keyboard
   ============================================================ */

'use strict';

/* ---------------- utilities ---------------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const fmtCr=c=>c.toFixed(1)+' CR';
const $=id=>document.getElementById(id);

/* localStorage that never throws — Safari private mode and quota limits
   would otherwise take down whatever call site was mid-flight */
const LS={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}},
};

function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0;a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

/* ---------------- audio (procedural WebAudio) ---------------- */
const Snd={
  ctx:null,master:null,engOsc:null,engGain:null,engNoise:null,
  muted:LS.get('e3k.mute')==='1',
  ensure(){
    if(this.ctx)return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();
      this.master.gain.value=this.muted?0:0.5;
      this.master.connect(this.ctx.destination);
      // engine hum: sawtooth through lowpass, gain follows throttle
      const o=this.ctx.createOscillator();o.type='sawtooth';o.frequency.value=40;
      const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=140;f.Q.value=4;
      const g=this.ctx.createGain();g.gain.value=0;
      o.connect(f);f.connect(g);g.connect(this.master);o.start();
      this.engOsc=o;this.engGain=g;
    }catch(e){/* audio unavailable */}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setMute(m){
    this.muted=m;LS.set('e3k.mute',m?'1':'0');
    if(this.master)this.master.gain.value=m?0:0.5;
  },
  engine(frac,combat){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    this.engGain.gain.setTargetAtTime(frac*0.11,t,0.1);
    this.engOsc.frequency.setTargetAtTime(35+frac*70,t,0.1);
  },
  tone(freq,dur,type='square',vol=0.2,slide=0){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);
    o.start(t);o.stop(t+dur+0.02);
  },
  _noiseBuf:null,
  /* One two-second bank of white noise, generated once and replayed at an
     offset. Filling a fresh buffer per call meant every large explosion ran a
     ~58k-iteration loop and threw the result away. */
  noiseBuffer(){
    if(!this._noiseBuf){
      const n=Math.floor(this.ctx.sampleRate*2);
      this._noiseBuf=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
      const d=this._noiseBuf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    return this._noiseBuf;
  },
  noise(dur,vol=0.3,fStart=3000,fEnd=200){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const buf=this.noiseBuffer();
    const src=this.ctx.createBufferSource();src.buffer=buf;
    // start at a random offset so repeated hits never sound identical
    const off=Math.random()*Math.max(0,buf.duration-dur);
    const f=this.ctx.createBiquadFilter();f.type='lowpass';
    f.frequency.setValueAtTime(fStart,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40,fEnd),t+dur);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    src.connect(f);f.connect(g);g.connect(this.master);
    src.start(t,off,dur);
  },
  laser(kind){
    if(kind==='mining')this.tone(300,0.15,'sawtooth',0.15,-200);
    else if(kind==='beam')this.tone(880,0.08,'square',0.10,-300);
    else if(kind==='military')this.tone(1200,0.09,'square',0.13,-600);
    else this.tone(700,0.12,'square',0.14,-500);
  },
  enemyLaser(){this.tone(420,0.12,'square',0.09,-260);},
  hit(){this.noise(0.12,0.25,2500,300);this.tone(180,0.1,'square',0.15,-80);},
  playerHit(){this.noise(0.25,0.4,1800,150);this.tone(90,0.25,'sawtooth',0.25,-40);},
  explosion(big){this.noise(big?1.2:0.7,big?0.55:0.4,big?900:1400,50);},
  missileWarn(){this.tone(1400,0.09,'square',0.18);setTimeout(()=>this.tone(1400,0.09,'square',0.18),140);},
  lockOn(){this.tone(950,0.07,'square',0.15);this.tone(1250,0.09,'square',0.15);},
  ecm(){for(let i=0;i<7;i++)setTimeout(()=>this.tone(500+Math.random()*1500,0.06,'sawtooth',0.12),i*55);},
  scoop(){this.tone(220,0.2,'sine',0.2,180);},
  cash(){this.tone(1046,0.07,'square',0.12);setTimeout(()=>this.tone(1568,0.1,'square',0.12),75);},
  err(){this.tone(160,0.18,'square',0.16);},
  click(){this.tone(2000,0.03,'square',0.06);},
  warning(){this.tone(600,0.12,'square',0.16);setTimeout(()=>this.tone(450,0.14,'square',0.16),150);},
  hyper(){
    if(!this.ctx)return;
    this.noise(1.6,0.35,300,4000);
    this.tone(60,1.6,'sawtooth',0.2,500);
  },
  dockChime(){
    const N=[523,659,784,1046];
    N.forEach((f,i)=>setTimeout(()=>this.tone(f,0.22,'triangle',0.16),i*110));
  },
  jump(){this.tone(200,0.5,'sine',0.15,400);}
};

/* ---------------- generative ambient music ----------------
   drifting detuned pads + echo, filter opens in combat,
   gentle arpeggio pings while docked. zero assets.          */
const Music={
  on:LS.get('e3k.music')!=='0',
  nodes:null,nextChord:0,chordIdx:0,
  ensure(){
    if(this.nodes||!Snd.ctx)return;
    const c=Snd.ctx;
    const g=c.createGain();g.gain.value=this.on?0.15:0;g.connect(Snd.master);
    const filt=c.createBiquadFilter();filt.type='lowpass';filt.frequency.value=420;filt.Q.value=1.1;
    const del=c.createDelay(1.5);del.delayTime.value=0.44;
    const fb=c.createGain();fb.gain.value=0.34;
    filt.connect(g);filt.connect(del);del.connect(fb);fb.connect(del);del.connect(g);
    const oscs=[];
    const detune=[-4,0,5];
    // seed the pads on the first chord root; leaving them at the 440Hz default
    // sounded a brief off-key drone before the first tick assigned a chord
    const root0=55, iv0=[1,1.5,2];
    for(let i=0;i<3;i++){
      const o=c.createOscillator();o.type='sawtooth';o.detune.value=detune[i];
      o.frequency.value=root0*iv0[i];
      const og=c.createGain();og.gain.value=0.045;
      o.connect(og);og.connect(filt);o.start();
      oscs.push(o);
    }
    const bass=c.createOscillator();bass.type='triangle';
    bass.frequency.value=root0/2;
    const bg=c.createGain();bg.gain.value=0;
    bass.connect(bg);bg.connect(filt);bass.start();
    this.nodes={g,filt,oscs,bass,bg};
    this.timer=setInterval(()=>this.tick(),420);
  },
  setOn(on){
    this.on=on;LS.set('e3k.music',on?'1':'0');
    if(this.nodes)this.nodes.g.gain.setTargetAtTime(on?0.15:0,Snd.ctx.currentTime,0.6);
  },
  tick(){
    if(!this.nodes||!this.on||typeof G==='undefined')return;
    const c=Snd.ctx,t=c.currentTime;
    const combat=G.mode==='flight'&&G.hostiles;
    const calm=G.mode==='docked'||G.mode==='title';
    if(t>=this.nextChord){
      this.nextChord=t+(calm?6:9)+Math.random()*3;
      const roots=[55,65.4,49,61.7,58.3,73.4];
      const root=roots[this.chordIdx++%roots.length]*(calm?2:1);
      const iv=[1,1.5,2];
      this.nodes.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(root*iv[i],t,2.4));
      this.nodes.bass.frequency.setTargetAtTime(root/2,t,0.8);
    }
    this.nodes.filt.frequency.setTargetAtTime(combat?1500:calm?750:430,t,1.4);
    this.nodes.bg.gain.setTargetAtTime(combat?0.09:0.02,t,0.5);
    // sparse sparkle pings; a soft arpeggio while docked
    if(Math.random()<(calm?0.45:0.18)){
      const scale=[220,261.6,329.6,392,440,523.2,659.2];
      Snd.tone(scale[Math.floor(Math.random()*scale.length)]*(calm?2:1),1.4,'sine',0.028);
    }
  }
};

function genDesc(rng,sys){
  const adj=['notable for','most famous for','best known for','reasonably noted for','mildly infamous for'];
  const things=['its exotic {f} plantations','its ancient {f} temples','its vast {f} oceans','its inhabitants\' eccentric love of {f}',
    'its {f} mining colonies','the {c} {f}','its pink {f} forests','its killer {f}','its exciting {f} racing','deadly {f} storms'];
  const f=['edible arts','vacuum krill','fabulous goat soup','plate tectonics','tourist attractions','arts graduates','cloud worms',
    'rock lobster','gargle blasters','hoopy casinos','silly games','wolf cubs','tree ants','mud fish','zero-g cricket','solar wind'];
  const c=['weird','peculiar','ancient','mysterious','ubiquitous'];
  const P=a=>a[Math.floor(rng()*a.length)];
  const t=P(things).replace('{f}',P(f)).replace('{c}',P(c));
  return `The planet ${sys.name.charAt(0)+sys.name.slice(1).toLowerCase()} is ${P(adj)} ${t}.`;
}

let CURRENT_GALAXY=1;
function buildGalaxy(gal=1){
  CURRENT_GALAXY=gal;
  GALAXY.length=0;
  const rng=mulberry32(GALAXY_SEED^((gal-1)*0x9E3779));
  const used=new Set(['LAVE','ZAONCE','DISO','LEESTI','RIEDQUAT','ORERVE','TIONISLA']);
  for(let i=0;i<256;i++){
    let name='';
    do{
      name='';
      const n=2+Math.floor(rng()*2.4);
      for(let k=0;k<n;k++)name+=NAME_PAIRS[Math.floor(rng()*NAME_PAIRS.length)];
      if(name.length>8)name=name.slice(0,8);
    }while(used.has(name)||name.length<4);
    used.add(name);
    const sys={
      i, name,
      x:rng()*256, y:rng()*128,
      economy:Math.floor(rng()*8),
      gov:Math.floor(rng()*8),
      pop:(1+rng()*6).toFixed(1),
    };
    sys.tech=clamp(Math.round((7-sys.economy)+sys.gov/2+rng()*4)+1,1,15);
    sys.color=new THREE.Color().setHSL(0.45+((sys.economy/8)*0.45+rng()*0.08),0.85,0.62).getHex();
    sys.radius=Math.round(3000+rng()*4500);
    sys.desc=genDesc(rng,sys);
    GALAXY.push(sys);
  }
  if(gal===1){
    // Lave — the traditional starting world
    const lave=GALAXY[7];
    lave.name='LAVE';lave.x=128;lave.y=64;lave.economy=5;lave.gov=3;lave.tech=5;lave.pop='2.5';
    lave.desc='The planet Lave is most famous for its vast rain forests and the Laveian tree grub.';
    // sprinkle a few classic names near Lave for the faithful
    const classics=[['ZAONCE',6],['DISO',3],['LEESTI',9],['RIEDQUAT',4],['ORERVE',12],['TIONISLA',14]];
    classics.forEach(([nm],k)=>{ const s=GALAXY[20+k*31]; if(s.name!=='LAVE') s.name=nm; });
  }
}

function distLY(a,b){
  const dx=a.x-b.x,dy=a.y-b.y;
  return Math.round(Math.sqrt(dx*dx+dy*dy)*0.4*10)/10;
}

// deterministic market for a system on a given day
function marketFor(sysIdx,day){
  const sys=GALAXY[sysIdx];
  const rng=mulberry32(GALAXY_SEED^(sysIdx*7349)^(Math.floor(day)*911)^(CURRENT_GALAXY*33461));
  return COMMODITIES.map((c,ci)=>{
    const jitter=(rng()-0.5)*c.base*0.22;
    let price=(c.base+c.eco*(sys.economy-3.5)*1.15+jitter)*0.4;
    price=Math.max(0.4,Math.round(price*10)/10);
    // plentiful where cheap for that economy
    const cheapness=-c.eco*(sys.economy-3.5)/14;   // -1..1, + = cheap here
    let qty=Math.max(0,Math.round(c.q*(1.3+cheapness*1.6)+(rng()-0.35)*8));
    if(c.illegal&&sys.gov>=5)qty=Math.floor(qty*rng()*0.4); // lawful worlds: scarce contraband
    return {ci,price,qty};
  });
}

/* ---------------- missions ---------------- */
const VIP_NAMES=['AMBASSADOR QIRA','DR. VELN TOSS','SENATOR OKKO','THE CURATOR','MADAME ZEL','PROFESSOR HAAB','ENVOY TRIS'];
function missionsFor(sysIdx,day,rep=0){
  const rng=mulberry32(GALAXY_SEED^(sysIdx*2711)^(Math.floor(day/3)*577)^(CURRENT_GALAXY*47));
  const out=[];
  const mult=1+Math.min(rep,24)*0.05;   // reputation raises pay up to +120%
  const n=2+Math.floor(rng()*3)+(rep>=12?1:0);
  const pickDest=(from,min,max)=>{
    for(let t=0;t<60;t++){
      const cand=GALAXY[Math.floor(rng()*256)];
      const d=distLY(GALAXY[from],cand);
      if(cand.i!==from&&cand.i!==sysIdx&&d>min&&d<max)return cand;
    }
    return null;
  };
  for(let k=0;k<n;k++){
    const r=rng();
    const dest=pickDest(sysIdx,5,32);
    if(!dest)continue;
    const d=distLY(GALAXY[sysIdx],dest);
    const deadline=Math.ceil(d*0.9+6+rng()*6);
    const id=CURRENT_GALAXY*1e6+sysIdx*1000+Math.floor(day/3)*17+k;
    if(r<0.3){
      out.push({id,type:'data',dest:dest.i,deadline,
        reward:Math.round((60+d*7+rng()*40)*mult),
        text:`Courier: carry encrypted data to ${dest.name} within ${deadline} days.`});
    }else if(r<0.55){
      const qty=1+Math.floor(rng()*4);
      out.push({id,type:'cargo',dest:dest.i,qty,deadline,
        reward:Math.round((90+d*9+qty*35+rng()*60)*mult),
        text:`Freight: haul ${qty}t of sealed cargo to ${dest.name} within ${deadline} days. Requires ${qty}t hold space.`});
    }else if(r<0.72){
      const who=VIP_NAMES[Math.floor(rng()*VIP_NAMES.length)];
      const rw=Math.round((120+d*10+rng()*80)*mult);
      out.push({id,type:'vip',dest:dest.i,qty:1,deadline,reward:rw,bonus:Math.round(rw*0.5),
        text:`Passenger: ferry ${who} to ${dest.name} within ${deadline} days (1t cabin). +50% bonus if delivered in half the time.`});
    }else if(r<0.88){
      const kills=2+Math.floor(rng()*4);
      out.push({id,type:'bounty',kills,deadline:deadline+8,
        reward:Math.round(kills*(70+rng()*50)*mult),
        text:`Bounty: destroy ${kills} pirate vessels within ${deadline+8} days. Payment on any station.`});
    }else{
      const second=pickDest(dest.i,4,24);
      if(!second){k--;continue;}
      const d2=distLY(dest,second);
      const dl=Math.ceil((d+d2)*0.9+10+rng()*6);
      out.push({id,type:'hop',dests:[dest.i,second.i],stage:0,deadline:dl,
        reward:Math.round((160+(d+d2)*11+rng()*90)*mult),
        text:`Circuit run: deliver dispatches to ${dest.name}, then ${second.name}, within ${dl} days. Paid in full at the final stop.`});
    }
  }
  return out;
}

/* retro flat-shaded hull palette: saturated 16-bit port colours that hold
   their identity once the lambert ramp darkens the off-facing facets */
const COLORS={
  pirate:0xe05a70, trader:0xf0b455, police:0x6f9fe8, player:0x63e6f2,
  asteroid:0x94a1ad, canister:0x4fc4d6, splinter:0x7ee0bc, missile:0xdf7cf5,
  station:0xaebcc9, planet:0x7dff9b, hostileMissile:0xff5470,
};

/* solid faceted hull from the ship's vertex cloud (all hulls are convex-ish) */
const _geoCache={};
function hullGeo(key){
  if(!_geoCache[key]){
    const pts=SHIPS[key].v.map(v=>new THREE.Vector3(v[0],v[1],v[2]));
    const solid=new ConvexGeometry(pts);
    const edges=new THREE.EdgesGeometry(solid,14);
    // every ship of a type reuses these, so teardown must never dispose them
    solid.userData.shared=edges.userData.shared=true;
    _geoCache[key]={solid,edges};
  }
  return _geoCache[key];
}

/* Release GPU buffers for an object tree. three.js only frees WebGL resources
   from dispose(); dropping a mesh from the scene graph leaves its buffers
   allocated until the context is lost.
   Two things must be skipped:
     - geometry flagged `shared` (the per-ship-type hull cache)
     - Sprite geometry, which three.js shares across EVERY sprite in the
       program; disposing it from one expiring effect deletes the buffer
       backing the sun, the planet haze and the docking beacon. */
function disposeObj(root){
  if(!root)return;
  root.traverse(o=>{
    const g=o.geometry;
    if(g&&!o.isSprite&&!(g.userData&&g.userData.shared))g.dispose();
    const m=o.material;
    if(m)(Array.isArray(m)?m:[m]).forEach(x=>x&&x.dispose&&x.dispose());
  });
}
function buildShipMesh(key,color){
  const g=hullGeo(key);
  const grp=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color,flatShading:true});
  grp.add(new THREE.Mesh(g.solid,mat));
  grp.add(new THREE.LineSegments(g.edges,
    new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.42})));
  grp.userData.mat=mat;
  return grp;
}

/* glow sprite texture (shared) */
let _glowTex=null;
function glowTexture(){
  if(_glowTex)return _glowTex;
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.25,'rgba(255,255,255,.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  _glowTex=new THREE.CanvasTexture(c);
  return _glowTex;
}
function glowSprite(color,scale){
  const m=new THREE.SpriteMaterial({map:glowTexture(),color,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const s=new THREE.Sprite(m);
  s.scale.setScalar(scale);
  return s;
}

/* Coriolis station: solid octagonal drum, dark docking slot on the planet-facing face */
function buildStation(){
  const R=520,      // rim radius
        F=250,      // face half-size
        D=210;      // half depth
  const pts=[];
  // front face square (z=-D, faces planet along -Z), rear square rotated 45°
  [[-F,-F,-D],[F,-F,-D],[F,F,-D],[-F,F,-D],
   [0,-F*1.2,D],[F*1.2,0,D],[0,F*1.2,D],[-F*1.2,0,D]].forEach(p=>pts.push(new THREE.Vector3(...p)));
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2+Math.PI/8;
    pts.push(new THREE.Vector3(Math.cos(a)*R,Math.sin(a)*R,0));
  }
  const solid=new ConvexGeometry(pts);
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(solid,new THREE.MeshLambertMaterial({color:COLORS.station,flatShading:true})));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(solid,14),
    new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.45})));
  // docking slot: a dark recessed mouth, rimmed in landing-light green
  const sw=95,sh=34;
  const slot=new THREE.Mesh(new THREE.BoxGeometry(sw*2,sh*2,10),
    new THREE.MeshBasicMaterial({color:0x010608}));
  slot.position.set(0,0,-D-4);
  grp.add(slot);
  const rim=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(sw*2,sh*2)),
    new THREE.LineBasicMaterial({color:0x7dff9b}));
  rim.position.set(0,0,-D-9.5);
  grp.add(rim);
  const beacon=glowSprite(0x7dff9b,120);
  beacon.position.set(0,0,-D-16);
  grp.add(beacon);
  grp.userData={R,D,slotW:sw,slotH:sh};
  return grp;
}

function buildAsteroid(r){
  const geo=new THREE.IcosahedronGeometry(r,1);
  const p=geo.attributes.position;
  const seenKeys={};
  for(let i=0;i<p.count;i++){
    const k=p.getX(i).toFixed(2)+','+p.getY(i).toFixed(2)+','+p.getZ(i).toFixed(2);
    if(!(k in seenKeys))seenKeys[k]=0.72+Math.random()*0.55;
    const s=seenKeys[k];
    p.setXYZ(i,p.getX(i)*s,p.getY(i)*s,p.getZ(i)*s);
  }
  geo.computeVertexNormals();
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:COLORS.asteroid,flatShading:true})));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,20),
    new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.3})));
  return grp;
}

function buildCanister(color){
  const geo=new THREE.CylinderGeometry(3,3,8,6,1,false);
  const grp=new THREE.Group();
  grp.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color,flatShading:true})));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo,14),
    new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.35})));
  return grp;
}

/* ---------------- three.js scene ---------------- */
let renderer,scene,camera,composer,bloomPass,bloomOn=LS.get('e3k.bloom')!=='0';
const W={planet:null,planetGlow:null,station:null,sun:null,sunLight:null,stars:null,titleShip:null};
const transients=[];   // {obj, life, ttl, vel? , kind}

function initScene(){
  renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  scene=new THREE.Scene();
  scene.fog=null;
  camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,1,2.5e6);
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  // solid hulls need a threshold so only lasers, glows and suns bloom
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.85,0.5,0.55);
  composer.addPass(bloomPass);
  // starfield — recentered on camera every frame so it never recedes
  const N=1600,pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const v=new THREE.Vector3().randomDirection().multiplyScalar(9e5);
    pos.set([v.x,v.y,v.z],i*3);
    const b=0.35+Math.random()*0.65;
    const tint=Math.random();
    col.set([b*(tint<0.15?0.7:1),b*(tint>0.85?0.85:1),b],i*3);
  }
  const sg=new THREE.BufferGeometry();
  sg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  sg.setAttribute('color',new THREE.BufferAttribute(col,3));
  W.stars=new THREE.Points(sg,new THREE.PointsMaterial({size:2200,vertexColors:true,
    transparent:true,opacity:0.9,depthWrite:false,sizeAttenuation:true}));
  scene.add(W.stars);
  addEventListener('resize',onResize);
}
function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  fitHudCanvases();
}
function setBloom(on){
  bloomOn=on;LS.set('e3k.bloom',on?'1':'0');
  bloomPass.enabled=on;
}

function clearWorld(){
  for(const k of ['planet','planetGlow','station','sun','titleShip'])
    if(W[k]){scene.remove(W[k]);disposeObj(W[k]);W[k]=null;}
  if(W.moons){for(const m of W.moons){scene.remove(m);disposeObj(m);}W.moons=null;}
  if(W.lights){for(const l of W.lights)scene.remove(l);W.lights=null;}   // lights hold no buffers
  for(const t of transients){scene.remove(t.obj);disposeObj(t.obj);}
  transients.length=0;
  for(const n of NPCS){scene.remove(n.obj);disposeObj(n.obj);}
  NPCS.length=0;
}

/* build the flight environment for a system */
function buildSystemScene(sys){
  clearWorld();
  const rng=mulberry32(GALAXY_SEED^(sys.i*131));
  // planet: flat-shaded faceted globe with an atmosphere haze
  const pr=sys.radius;
  const pg=new THREE.Group();
  pg.add(new THREE.Mesh(new THREE.IcosahedronGeometry(pr,2),
    new THREE.MeshLambertMaterial({color:sys.color,flatShading:true})));
  const glow=glowSprite(sys.color,pr*2.9);
  glow.material.opacity=0.22;
  pg.add(glow);
  // settlement lights on populous high-tech worlds
  if(parseFloat(sys.pop)>4&&sys.tech>6){
    const n=Math.round(parseFloat(sys.pop)*6);
    const lp=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const v=new THREE.Vector3().randomDirection().multiplyScalar(pr*1.01);
      lp.set([v.x,v.y,v.z],i*3);
    }
    const lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.BufferAttribute(lp,3));
    pg.add(new THREE.Points(lg,new THREE.PointsMaterial({color:0xfff2a8,size:pr*0.035,
      transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false})));
  }
  // ring system
  if(rng()<0.3){
    const tilt=0.4+rng()*0.6;
    for(let k=0;k<2+Math.floor(rng()*2);k++){
      const rr=pr*(1.55+k*0.22+rng()*0.08);
      const pts=[];
      for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rr,0,Math.sin(a)*rr));}
      const ring=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:sys.color,transparent:true,opacity:0.4-k*0.08}));
      ring.rotation.x=tilt;
      pg.add(ring);
    }
  }
  pg.position.set(0,0,0);
  scene.add(pg);
  W.planet=pg;W.planet.userData.r=pr;
  // moons orbit inside their own pivot so the planet's spin doesn't drag them
  W.moons=[];
  const nMoons=Math.floor(rng()*3);
  for(let m=0;m<nMoons;m++){
    const pivot=new THREE.Group();
    const mr=pr*(0.10+rng()*0.10);
    const md=pr*(2.6+m*1.1+rng()*0.6);
    const moon=new THREE.Mesh(new THREE.IcosahedronGeometry(mr,1),
      new THREE.MeshLambertMaterial({color:0x9fb0ba,flatShading:true}));
    moon.position.set(md,0,0);
    pivot.rotation.y=rng()*6.28;
    pivot.rotation.x=(rng()-0.5)*0.5;
    pivot.userData.spd=0.02+rng()*0.03;
    pivot.add(moon);
    scene.add(pivot);
    W.moons.push(pivot);
  }
  // sun — far away in a random-ish direction
  const sunDir=new THREE.Vector3(Math.sin(sys.i*1.7),Math.sin(sys.i*0.9)*0.4,Math.cos(sys.i*1.7)).normalize();
  const sunPos=sunDir.multiplyScalar(7.2e5);
  const sun=new THREE.Group();
  const sunColor=new THREE.Color().setHSL(0.07+rng()*0.1,1,0.72).getHex();
  sun.add(glowSprite(sunColor,2.6e5));
  sun.add(glowSprite(0xffffff,1.1e5));
  if(rng()<0.15){   // binary companion
    const twin=new THREE.Group();
    const twinColor=new THREE.Color().setHSL(0.55+rng()*0.12,1,0.7).getHex();
    twin.add(glowSprite(twinColor,1.2e5));
    twin.add(glowSprite(0xffffff,0.5e5));
    twin.position.set(1.6e5,(rng()-0.5)*8e4,1.1e5);
    sun.add(twin);
  }
  sun.position.copy(sunPos);
  scene.add(sun);
  W.sun=sun;
  // flat-shaded hulls: hard key from the sun, cool kicker opposite, sky/ground fill
  // so every facet lands on a different value and the silhouette never goes black
  const key=new THREE.DirectionalLight(0xfff4e2,2.6);
  key.position.copy(sun.position);
  const kick=new THREE.DirectionalLight(0x6fa8d8,0.9);
  kick.position.copy(sun.position).negate().setY(sun.position.y+3e5);
  const fill=new THREE.HemisphereLight(0xa8c8dd,0x2a3742,1.0);
  scene.add(key,kick,fill);
  W.lights=[key,kick,fill];
  // station — orbits the planet, faces it
  const st=buildStation();
  const sa=rng()*Math.PI*2;
  st.position.set(Math.cos(sa)*pr*2.4,pr*(rng()-0.5)*0.8,Math.sin(sa)*pr*2.4);
  st.lookAt(0,0,0);           // slot faces the planet along local -Z... lookAt points +Z; flip below
  st.rotateY(Math.PI);        // now local -Z (slot face) points at the planet
  scene.add(st);
  W.station=st;
}

/* witchspace: starless void between the stars — no planet, no station, no sun */
function buildWitchspaceScene(){
  clearWorld();
  // a sickly green nebula smear so the void reads as "wrong"
  const neb=new THREE.Group();
  for(let i=0;i<5;i++){
    const s=glowSprite(0x2e5d3a,3e5+Math.random()*3e5);
    s.material.opacity=0.12;
    s.position.set((Math.random()-0.5)*1.4e6,(Math.random()-0.5)*7e5,(Math.random()-0.5)*1.4e6);
    neb.add(s);
  }
  scene.add(neb);
  W.sun=neb;   // reuse slot so clearWorld tidies it
  // sickly half-light: witchspace has no sun
  const key=new THREE.DirectionalLight(0x9fdcb4,0.9);
  key.position.set(0.4,1,0.3);
  const fill=new THREE.AmbientLight(0x36584a,0.7);
  scene.add(key,fill);
  W.lights=[key,fill];
}

/* station's slot axis: from station toward planet (world space) */
function stationAxis(out){
  out.set(0,0,-1).applyQuaternion(W.station.quaternion).normalize();
  return out;
}
function slotCenter(out){
  return out.copy(W.station.position).addScaledVector(stationAxis(_v4),W.station.userData.D+2);
}

/* ---------------- transient FX ---------------- */
function spawnExplosion(pos,size,color=0xffb347){
  const n=26;
  const geo=new THREE.BufferGeometry();
  const p=new Float32Array(n*6),vel=[];
  for(let i=0;i<n;i++){
    const d=new THREE.Vector3().randomDirection();
    const sp=rnd(0.4,1)*size*2.2;
    p.set([0,0,0,d.x*4,d.y*4,d.z*4],i*6);
    vel.push(d.multiplyScalar(sp));
  }
  geo.setAttribute('position',new THREE.BufferAttribute(p,3));
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:1,blending:THREE.AdditiveBlending});
  const obj=new THREE.LineSegments(geo,mat);
  obj.position.copy(pos);
  scene.add(obj);
  transients.push({obj,ttl:1.4,life:1.4,kind:'boom',vel});
  const flash=glowSprite(0xffffff,size*6);
  flash.position.copy(pos);
  scene.add(flash);
  transients.push({obj:flash,ttl:0.35,life:0.35,kind:'flash'});
}

function spawnTracer(from,to,color){
  const geo=new THREE.BufferGeometry().setFromPoints([from.clone(),to.clone()]);
  const obj=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending}));
  scene.add(obj);
  transients.push({obj,ttl:0.14,life:0.14,kind:'tracer'});
}

/* player laser beams: two lines from lower screen corners converging ahead */
function spawnPlayerBeams(color,convergePoint){
  const ndcs=[[-0.55,-0.62],[0.55,-0.62]];
  for(const [nx,ny] of ndcs){
    const from=new THREE.Vector3(nx,ny,0.35).unproject(camera);
    const geo=new THREE.BufferGeometry().setFromPoints([from,convergePoint.clone()]);
    const obj=new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending}));
    scene.add(obj);
    transients.push({obj,ttl:0.09,life:0.09,kind:'tracer'});
  }
}

function updateTransients(dt){
  for(let i=transients.length-1;i>=0;i--){
    const t=transients[i];
    t.ttl-=dt;
    if(t.ttl<=0){
      scene.remove(t.obj);
      disposeObj(t.obj);      // sprite-safe: never touches the shared sprite geometry
      transients.splice(i,1);continue;
    }
    const f=t.ttl/t.life;
    if(t.kind==='boom'){
      const p=t.obj.geometry.attributes.position;
      for(let k=0;k<t.vel.length;k++){
        const v=t.vel[k];
        p.array[k*6+0]+=v.x*dt*0.4;p.array[k*6+1]+=v.y*dt*0.4;p.array[k*6+2]+=v.z*dt*0.4;
        p.array[k*6+3]+=v.x*dt;p.array[k*6+4]+=v.y*dt;p.array[k*6+5]+=v.z*dt;
      }
      p.needsUpdate=true;
      t.obj.material.opacity=f;
    }else if(t.kind==='flash'){
      t.obj.scale.multiplyScalar(1+dt*3);
      t.obj.material.opacity=f;
    }else{
      t.obj.material.opacity=f*0.95;
    }
  }
}

/* hyperspace streak tunnel */
let hyperStreaks=null;
function startHyperFX(){
  const n=240,pos=new Float32Array(n*6);
  hyperStreaks={obj:null,pts:[]};
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),r=rnd(60,900);
    const x=Math.cos(a)*r,y=Math.sin(a)*r,z=rnd(-4000,-100);
    pos.set([x,y,z,x,y,z-rnd(200,900)],i*6);
    hyperStreaks.pts.push({i,speed:rnd(4000,9000)});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const obj=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x9fe8ff,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending}));
  hyperStreaks.obj=obj;
}
function updateHyperFX(dt){
  if(!hyperStreaks)return;
  const obj=hyperStreaks.obj;
  obj.position.copy(camera.position);
  obj.quaternion.copy(camera.quaternion);
  const p=obj.geometry.attributes.position;
  for(const s of hyperStreaks.pts){
    p.array[s.i*6+2]+=s.speed*dt;
    p.array[s.i*6+5]+=s.speed*dt;
    if(p.array[s.i*6+5]>60){
      const z=-4000-rnd(0,800);
      p.array[s.i*6+2]=z;p.array[s.i*6+5]=z-rnd(200,900);
    }
  }
  p.needsUpdate=true;
  if(!obj.parent)scene.add(obj);
}
function stopHyperFX(){
  if(!hyperStreaks)return;
  scene.remove(hyperStreaks.obj);
  disposeObj(hyperStreaks.obj);   // geometry *and* material
  hyperStreaks=null;
}

function buyShip(key){
  const c=G.cmdr,s=PSHIPS[key];
  const net=s.price-Math.round(PSHIPS[c.ship||'cobra'].price*0.75);
  if(key===c.ship){Snd.err();return;}
  if(cargoUsed(c)>holdOf(c,key)){msg('HOLD TOO SMALL FOR CURRENT CARGO');Snd.err();return;}
  if(c.credits<net){Snd.err();return;}
  c.credits-=net;
  c.ship=key;

  c.missiles=Math.min(c.missiles,s.missiles);
  c.boughtShip=true;

  G.dockLog.push(`SHIP TRANSFERRED — WELCOME ABOARD YOUR ${s.label}`);

/* ---------------- story: the Constrictor hunt ---------------- */
const STORY_TEXT=[
  '',
  'CH.1 — A naval liaison corners you in the docking lounge: the experimental CONSTRICTOR was stolen from the Xeer shipyards. Its trail leads to %S. Find it.',
  'CH.2 — Dock workers remember the ship: "fast, ECM-proof, gone in hours." It refuelled and burned hard for %S.',
  'CH.3 — A wounded bounty hunter croaks the next lead over station comms: the Constrictor razed a convoy near %S.',
  'CH.4 — Naval intelligence triangulates the signature. It is cornered — %S is the end of the line.',
  'CH.5 — CONTACT. The Constrictor is in-system at %S. Destroy it. The Navy is paying 5,000 CR.',
];
function storyEligible(c){return !c.storyDone&&(c.kills>=32||c.days>=15);}
function storyPickTarget(c){
  for(let t=0;t<80;t++){
    const s=GALAXY[irnd(0,255)];
    const d=distLY(GALAXY[c.system],s);
    if(s.i!==c.system&&d>7&&d<19)return s.i;
  }
  return (c.system+37)%256;
}
function storyAdvance(){
  const c=G.cmdr;
  if(!c.story)c.story={stage:0,sys:null,gal:0,killed:false};
  const st=c.story;
  if(st.stage>0&&st.gal!==c.galaxy)return;   // trail is cold in another galaxy
  if(st.stage>=1&&st.stage<=4&&c.system===st.sys){
    st.stage++;
    if(st.stage<=5){
      st.sys=storyPickTarget(c);
      G.dockLog.push('NAVY CHANNEL: '+STORY_TEXT[st.stage].replace('%S',GALAXY[st.sys].name));
      Snd.warning();
    }
  }else if(st.stage===5&&st.killed){
    st.stage=6;
    c.credits+=5000;
    c.storyDone=true;
    G.dockLog.push('NAVY CHANNEL: CONSTRICTOR CONFIRMED DESTROYED — 5,000 CR AWARDED.');
    G.dockLog.push('Navy engineers fit your ship with the prototype’s drive tuning: +10% thrust, permanently.');
    statsOf(c).earned+=5000;
    Snd.cash();
  }
}
function storyAccept(){
  const c=G.cmdr;
  c.story={stage:1,sys:storyPickTarget(c),gal:c.galaxy,killed:false};
  G.dockLog.push('NAVY CHANNEL: '+STORY_TEXT[1].replace('%S',GALAXY[c.story.sys].name));
  Snd.warning();
}

/* ---------------- save / load ---------------- */
function saveTo(slot){
  // sysName is stored so save-slot listings stay truthful even when the
  // galaxy currently in memory is not the one the save was made in
  const o={...G.cmdr,sysName:GALAXY[G.cmdr.system].name,ts:Date.now()};
  return LS.set('e3k.'+slot,JSON.stringify(o));
}
function loadFrom(slot){
  try{
    const o=JSON.parse(LS.get('e3k.'+slot));
    if(o&&o.v===1)return o;
  }catch(e){}
  return null;
}
function slotMeta(slot){
  const o=loadFrom(slot);
  if(!o)return null;
  // only trust the in-memory galaxy for the name when it is the save's own galaxy
  const gal=o.galaxy||1;
  const where=o.sysName||(gal===CURRENT_GALAXY?GALAXY[o.system].name:'SYSTEM '+o.system);
  const galTag=gal>1?` · GAL ${gal}`:'';
  return `${o.name} · ${where}${galTag} · ${fmtCr(o.credits)} · DAY ${Math.floor(o.days)}`;
}

/* ---------------- messages ---------------- */
function msg(text,color){
  const el=document.createElement('div');
  el.textContent=text;
  if(color)el.style.color=color;
  $('msgs').appendChild(el);
  while($('msgs').children.length>4)$('msgs').firstChild.remove();
  setTimeout(()=>{el.style.opacity='0';},2600);
  setTimeout(()=>{el.remove();},3200);
}

/* ---------------- system entry / docking ---------------- */
/* Arm the Constrictor ambush whenever the player is loose in its system with
   the contract still open. Called on arrival AND on launch, because docking
   clears every NPC — without re-arming, docking once would retire the boss
   permanently and strand the storyline at chapter five. */
function armBoss(){
  const c=G.cmdr,st=c&&c.story;
  const live=!!(st&&st.stage===5&&!st.killed&&st.gal===c.galaxy
                &&c.system===st.sys&&!G.witch);
  // only queue an arrival when one is not already on the scanner
  G.bossT=(live&&!NPCS.some(n=>n.key==='constrictor'))?9:0;
  return live;
}

function enterSystem(idx,arriving){
  G.witch=null;
  G.cmdr.system=idx;
  G.sys=GALAXY[idx];
  buildSystemScene(G.sys);
  const pr=G.sys.radius;
  const dir=new THREE.Vector3().randomDirection();
  dir.y*=0.4;dir.normalize();
  camera.position.copy(dir.multiplyScalar(pr*4+60000));
  camera.lookAt(W.station.position);
  G.speed=maxSpd()*0.3;G.throttle=0.3;
  G.warp=false;G.lock.target=null;
  G.spawnT=arriving?3:8;
  armBoss();
  if(arriving)msg('ARRIVAL: '+G.sys.name+' SYSTEM');
}

function dock(){
  G.mode='docked';
  G.warp=false;G.speed=0;G.throttle=0;G.lock.target=null;
  G.witch=null;                      // docking always means a real station
  G.shieldF=G.shieldA=100;G.energy=400;G.laserTemp=0;G.cabinHeat=0;
  G.cmdr.lastStation=G.cmdr.system;
  G.cmdr.days=Math.round((G.cmdr.days+0.1)*10)/10;
  G.dockLog.length=0;
  // everything below can throw on malformed save data; the station UI must open
  // regardless, or the player is left in 'docked' mode with no interface at all
  try{
    processMissionsOnDock();
    storyAdvance();
    if(G.cmdr.story&&G.cmdr.story.stage===0&&storyEligible(G.cmdr))
      G.dockLog.push('NAVY CHANNEL: a liaison officer wants a word — see the BBS.');
    markVisited(G.cmdr);
    checkAchs();
  }catch(e){
    G.dockLog.push('STATION SYSTEMS REPORTED A FAULT — SOME RECORDS MAY BE INCOMPLETE');
  }
  G.mkt=marketFor(G.cmdr.system,G.cmdr.days);
  if(!saveTo('autosave'))
    G.dockLog.push('WARNING: COULD NOT WRITE TO SHIP RECORDER — PROGRESS IS NOT BEING SAVED');
  Snd.dockChime();Snd.engine(0);
  for(const n of NPCS){scene.remove(n.obj);disposeObj(n.obj);}
  NPCS.length=0;
  showDocked();
}

function undock(){
  saveTo('autosave');    // keep station purchases if the flight goes badly
  hideDocked();
  G.mode='flight';
  const axis=stationAxis(_v1);
  slotCenter(_v2);
  camera.position.copy(_v2).addScaledVector(axis,300);
  _m1.lookAt(camera.position,_v3.copy(camera.position).addScaledVector(axis,1000),UP);
  camera.quaternion.setFromRotationMatrix(_m1);
  G.speed=maxSpd()*0.35;G.throttle=0.35;
  G.spawnT=10;G.grace=40;
  armBoss();
  msg('LAUNCH CLEARED — '+G.sys.name+' STATION');
  updateHud(true);
}

function tryAutoDock(){
  if(!W.station){msg('NO STATION SIGNAL');Snd.err();return;}
  if(!G.cmdr.equip.dockcomp){msg('NO DOCKING COMPUTER FITTED',getComputedStyle(document.documentElement).getPropertyValue('--rd'));Snd.err();return;}
  const d=camera.position.distanceTo(W.station.position);
  if(d>9000){msg('DOCKING COMPUTER: OUT OF RANGE (9KM)');Snd.err();return;}
  if(G.hostiles){msg('DOCKING COMPUTER: HOSTILES DETECTED');Snd.err();return;}
  G.mode='autodock';G.autodock=0;G.warp=false;
  msg('DOCKING SEQUENCE ENGAGED');
  Snd.jump();
}

function updateAutodock(dt){
  G.autodock+=dt;
  const t=G.autodock/4.0;
  slotCenter(_v2);
  camera.position.lerp(_v2,Math.min(1,dt*1.4));
  _m1.lookAt(camera.position,W.station.position,UP);
  _q1.setFromRotationMatrix(_m1);
  camera.quaternion.slerp(_q1,Math.min(1,dt*2));
  if(t>0.72)$('fade').style.opacity='1';
  if(t>=1){
    dock();
    setTimeout(()=>$('fade').style.opacity='0',150);
  }
}

/* ---------------- missions ---------------- */
function processMissionsOnDock(){
  const c=G.cmdr;
  const S=statsOf(c);
  const done=(pay)=>{S.earned+=pay;S.missionsDone++;};
  for(let i=c.missions.length-1;i>=0;i--){
    const m=c.missions[i];
    if(m.type==='bounty'&&m.progress>=m.kills){
      c.credits+=m.reward;c.rep=(c.rep||0)+1;done(m.reward);
      G.dockLog.push(`BOUNTY CONTRACT COMPLETE — ${fmtCr(m.reward)} PAID`);
      c.missions.splice(i,1);Snd.cash();continue;
    }
    if((m.type==='data'||m.type==='cargo'||m.type==='vip')&&m.dest===c.system&&inMissionGalaxy(m)){
      let pay=m.reward;
      if(m.type==='vip'&&c.days-m.acceptDay<=m.deadline/2){
        pay+=m.bonus;
        G.dockLog.push(`PASSENGER DELIGHTED BY SWIFT PASSAGE — BONUS ${fmtCr(m.bonus)}`);
      }
      c.credits+=pay;c.rep=(c.rep||0)+1;done(pay);
      if(m.type==='cargo'||m.type==='vip')c.missionCargo=Math.max(0,c.missionCargo-m.qty);
      G.dockLog.push(`${m.type==='data'?'DATA DELIVERED':m.type==='vip'?'PASSENGER DISEMBARKED':'FREIGHT DELIVERED'} — ${fmtCr(pay)} PAID`);
      c.missions.splice(i,1);Snd.cash();continue;
    }
    if(m.type==='hop'&&m.dests[m.stage]===c.system&&inMissionGalaxy(m)){
      m.stage++;
      if(m.stage>=m.dests.length){
        c.credits+=m.reward;c.rep=(c.rep||0)+2;done(m.reward);
        G.dockLog.push(`CIRCUIT COMPLETE — ${fmtCr(m.reward)} PAID`);
        c.missions.splice(i,1);Snd.cash();
      }else{
        G.dockLog.push(`DISPATCHES DELIVERED — PROCEED TO ${GALAXY[m.dests[m.stage]].name}`);
        Snd.cash();
      }
      continue;
    }
    if(c.days>m.deadlineDay){
      if(m.type==='cargo'||m.type==='vip')c.missionCargo=Math.max(0,c.missionCargo-m.qty);
      c.rep=Math.max(0,(c.rep||0)-1);
      G.dockLog.push(`CONTRACT EXPIRED: ${m.type.toUpperCase()} — REPUTATION SUFFERS`);
      c.missions.splice(i,1);
    }
  }
}
function acceptMission(m){
  const c=G.cmdr;
  if(c.missions.length>=4){msg('CONTRACT LOG FULL (4)');Snd.err();return false;}
  if(c.missions.some(x=>x.id===m.id&&x.gal===c.galaxy)){Snd.err();return false;}
  if((m.type==='cargo'||m.type==='vip')&&cargoUsed(c)+m.qty>c.cargoCap){Snd.err();return false;}
  // gal is stamped because destinations are bare system indices; without it a
  // contract would settle against whatever system shares that index in the
  // galaxy you happen to be standing in
  const copy={...m,gal:c.galaxy,deadlineDay:Math.ceil(c.days)+m.deadline,progress:0,acceptDay:c.days};
  if(m.type==='cargo'||m.type==='vip')c.missionCargo+=m.qty;
  c.missions.push(copy);
  Snd.cash();
  return true;
}
/* a contract only settles in the galaxy it was signed in */
const inMissionGalaxy=m=>(m.gal===undefined||m.gal===G.cmdr.galaxy);

/* ---------------- trading ---------------- */
function buyGood(ci,qty){
  const c=G.cmdr,row=G.mkt[ci],com=COMMODITIES[ci];
  qty=Math.min(qty,row.qty,c.cargoCap-cargoUsed(c),Math.floor(c.credits/row.price));
  if(qty<=0){Snd.err();return;}
  c.credits-=qty*row.price;c.cargo[ci]+=qty;row.qty-=qty;
  if(com.illegal&&Math.random()<0.3){c.legal+=4;G.dockLog.push('CONTRABAND TRANSACTION LOGGED BY STATION POLICE');}
  Snd.click();
}
function sellGood(ci,qty){
  const c=G.cmdr,row=G.mkt[ci],com=COMMODITIES[ci];
  qty=Math.min(qty,c.cargo[ci]);
  if(qty<=0){Snd.err();return;}
  c.credits+=qty*row.price;c.cargo[ci]-=qty;row.qty+=qty;
  statsOf(c).earned+=qty*row.price;
  if(com.illegal&&Math.random()<0.3){c.legal+=4;G.dockLog.push('CONTRABAND TRANSACTION LOGGED BY STATION POLICE');}
  Snd.cash();
}

    kind,key,obj,def,
    hp:opts.hp||def.hp||10,
    speed:opts.speed!==undefined?opts.speed:(def.speed||100)*rnd(0.5,0.8),
    turn:def.turn||1,
    state:opts.state||'idle', t:rnd(1,3), fireT:rnd(1,2),
    missiles:def.missiles||0, ecmHard:false,
    hasEcm:opts.hasEcm||false,
    bounty:def.bounty?irnd(def.bounty[0],def.bounty[1]):0,
    target:opts.target||null,
    spin:kind==='asteroid'||kind==='canister'||kind==='splinter'
      ?new THREE.Vector3(rnd(-0.5,0.5),rnd(-0.5,0.5),rnd(-0.5,0.5)):null,
    drift:opts.drift||null,
    ci:opts.ci, attacked:false,
  };
  NPCS.push(n);
  return n;
}

function removeNPC(n){
  const i=NPCS.indexOf(n);
  if(i>=0)NPCS.splice(i,1);
  scene.remove(n.obj);
  disposeObj(n.obj);   // asteroids and canisters build fresh geometry per spawn
  if(G.lock.target===n)G.lock.target=null;
}

function killNPC(n,byPlayer){
  if(window.DEBUG_KILLS)console.warn('killNPC',n.kind,n.key,'by:',byPlayer,'hp:',n.hp,new Error().stack.split('\n').slice(1,5).join(' | '));
  spawnExplosion(n.obj.position,(n.def.size||20),n.kind==='asteroid'?0x8fa3ad:0xffb347);
  const d=camera.position.distanceTo(n.obj.position);
  Snd.explosion(d<3000&&(n.def.size||0)>40);
  if(byPlayer){
    if(n.kind==='pirate'){
      G.cmdr.kills++;G.cmdr.credits+=n.bounty;
      statsOf(G.cmdr).earned+=n.bounty;
      if(n.key==='thargoid')G.cmdr.thargoidKills=(G.cmdr.thargoidKills||0)+1;
      if(n.key==='constrictor'){
        if(G.cmdr.story)G.cmdr.story.killed=true;
        msg('CONSTRICTOR DESTROYED — REPORT TO ANY STATION',cssVar('--am'));
      }else{
        msg(`TARGET DESTROYED — BOUNTY ${fmtCr(n.bounty)}`);
      }
      for(const m of G.cmdr.missions)if(m.type==='bounty')m.progress=(m.progress||0)+1;
      checkAchs();
    }else if(n.kind==='trader'){
      G.cmdr.kills++;G.cmdr.legal+=20;
      msg('CLEAN VESSEL DESTROYED — POLICE ALERTED',cssVar('--rd'));
    }else if(n.kind==='police'){
      G.cmdr.kills++;G.cmdr.legal+=40;
      msg('POLICE VESSEL DESTROYED — FUGITIVE STATUS',cssVar('--rd'));
    }
  }
  // cargo spill
  if(n.kind==='trader'||n.kind==='pirate'){
    const k=irnd(0,n.kind==='trader'?3:1);
    for(let i=0;i<k;i++){
      spawnNPC('canister',null,_v1.copy(n.obj.position).add(_v2.set(rnd(-40,40),rnd(-40,40),rnd(-40,40))),
        {ci:irnd(0,COMMODITIES.length-1),hp:5,speed:0,
         drift:new THREE.Vector3(rnd(-14,14),rnd(-14,14),rnd(-14,14))});
    }
  }
  if(n.kind==='asteroid'&&byPlayer==='mining'){
    const k=irnd(2,4);
    for(let i=0;i<k;i++){
      spawnNPC('splinter',null,_v1.copy(n.obj.position).add(_v2.set(rnd(-60,60),rnd(-60,60),rnd(-60,60))),
        {hp:3,speed:0,drift:new THREE.Vector3(rnd(-20,20),rnd(-20,20),rnd(-20,20))});
    }
    msg('ASTEROID FRACTURED — ORE ADRIFT');
  }
  removeNPC(n);
}

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* steering: rotate n toward a world point, capped at turn rate */
function steerToward(n,point,dt,turnMult=1){
  _m1.lookAt(n.obj.position,point,UP);
  _q1.setFromRotationMatrix(_m1);
  n.obj.quaternion.rotateTowards(_q1,n.turn*turnMult*dt);
}
function npcForward(n,out){return out.set(0,0,-1).applyQuaternion(n.obj.quaternion);}

function updateNPCs(dt,wdt){
  const ppos=camera.position;
  for(let i=NPCS.length-1;i>=0;i--){
    const n=NPCS[i];
    const dist=n.obj.position.distanceTo(ppos);
    // cull far junk
    if(dist>52000&&n.kind!=='missile'){removeNPC(n);continue;}
    if(n.spin){
      n.obj.rotation.x+=n.spin.x*wdt;n.obj.rotation.y+=n.spin.y*wdt;
      if(n.drift)n.obj.position.addScaledVector(n.drift,wdt);
      // scooping / collision with player
      if((n.kind==='canister'||n.kind==='splinter')&&dist<75){
        if(G.cmdr.equip.scoop&&cargoUsed(G.cmdr)<G.cmdr.cargoCap&&G.speed<maxSpd()*0.75){
          const ci=n.kind==='splinter'?12:n.ci;   // splinters -> minerals
          G.cmdr.cargo[ci]++;
          statsOf(G.cmdr).scooped++;
          msg('SCOOPED: 1T '+COMMODITIES[ci].name);
          Snd.scoop();
        }else{
          msg(G.cmdr.equip.scoop?'SCOOP FAILED — TOO FAST OR HOLD FULL':'CANISTER DESTROYED — NO FUEL SCOOP');
          Snd.hit();
        }
        removeNPC(n);continue;
      }
      if(n.kind==='asteroid'&&dist<(n.def.size||120)+60){
        damagePlayer(20,_v1.copy(n.obj.position).sub(ppos).normalize());
        _v2.copy(ppos).sub(n.obj.position).normalize();
        camera.position.addScaledVector(_v2,80);
        msg('ASTEROID COLLISION',cssVar('--rd'));
      }
      continue;
    }
    if(n.kind==='missile'){
      const tgt=n.target==='player'?ppos:(n.target&&NPCS.includes(n.target)?n.target.obj.position:null);
      if(!tgt){removeNPC(n);continue;}
      steerToward(n,tgt,dt,1);
      n.obj.position.addScaledVector(npcForward(n,_v1),n.speed*dt);
      n.t-=dt;
      const td=n.obj.position.distanceTo(tgt);
      if(td<120){
        if(n.target==='player'){
          spawnExplosion(n.obj.position,30);
          damagePlayer(46,_v1.copy(n.obj.position).sub(ppos).normalize());
          Snd.explosion(true);
        }else{
          damageNPC(n.target,90,true);
        }
        removeNPC(n);continue;
      }
      // target ECM defense
      if(n.target!=='player'&&n.target.hasEcm&&td<2600&&Math.random()<dt*0.9){
        spawnExplosion(n.obj.position,16,0xe070ff);Snd.ecm();
        msg('MISSILE DESTROYED BY TARGET ECM');
        removeNPC(n);continue;
      }
      if(n.t<0){removeNPC(n);continue;}   // fuel exhausted
      continue;
    }
    /* ---- ships ---- */
    n.t-=dt;n.fireT-=dt;
    let desired=null,thrust=0.7;
    if(n.kind==='pirate'||(n.kind==='police'&&isWanted())||n.state==='hostile'){
      // attack behavior
      if(n.state==='break'){
        desired=_v1.copy(n.obj.position).sub(ppos).normalize().multiplyScalar(4000).add(n.obj.position);
        thrust=1;
        if(n.t<0){n.state='attack';n.t=rnd(4,7);}
      }else if(n.hp<n.def.hp*0.25&&n.kind==='pirate'&&n.key!=='thargoid'){
        desired=_v1.copy(n.obj.position).sub(ppos).normalize().multiplyScalar(6000).add(n.obj.position);
        thrust=1;   // flee
      }else{
        desired=ppos;
        thrust=dist>2600?1:0.45;
        if(n.t<0&&dist<1400){n.state='break';n.t=rnd(2,3.5);}
        // fire
        npcForward(n,_v2);
        _v3.copy(ppos).sub(n.obj.position).normalize();
        const aim=_v2.dot(_v3);
        if(n.fireT<0&&dist<5200&&aim>0.965){
          n.fireT=n.def.fireRate*rnd(0.8,1.3);
          const hitChance=clamp(0.55-(dist/5200)*0.3-(G.speed/maxSpd())*0.15+aim*0.25,0.1,0.85);
          const from=n.obj.position;
          if(Math.random()<hitChance){
            spawnTracer(from,_v4.copy(ppos).add(_v2.set(rnd(-8,8),rnd(-8,8),rnd(-8,8))),0xff5470);
            damagePlayer(n.def.dmg*rnd(0.8,1.2),_v3.copy(from).sub(ppos).normalize());
          }else{
            spawnTracer(from,_v4.copy(ppos).add(_v2.set(rnd(-160,160),rnd(-160,160),rnd(-160,160))),0xff5470);
            if(dist<3500)Snd.enemyLaser();
          }
        }
        // missile launch
        if(n.missiles>0&&dist>1800&&dist<6000&&Math.random()<dt*0.05){
          n.missiles--;
          const m=spawnNPC('missile','missile',n.obj.position.clone(),{target:'player',speed:SHIPS.missile.speed,hp:1});
          m.t=14;
          m.obj.quaternion.copy(n.obj.quaternion);
          msg('INCOMING MISSILE',cssVar('--rd'));
          Snd.missileWarn();
        }
      }
    }else if(n.kind==='trader'){
      if(n.attacked){
        desired=_v1.copy(n.obj.position).sub(ppos).normalize().multiplyScalar(8000).add(n.obj.position);
        thrust=1;
      }else if(n.traffic==='out'){
        desired=n.away;thrust=0.7;
        if(!n.away||n.obj.position.distanceTo(n.away)<700){removeNPC(n);continue;}
      }else if(W.station){
        desired=W.station.position;
        thrust=0.8;
        if(n.obj.position.distanceTo(W.station.position)<1500){removeNPC(n);continue;}
      }
    }else if(n.kind==='police'){
      if(W.station){
        // patrol a ring near the station
        if(!n.patrol||n.t<0){
          n.patrol=_v1.copy(W.station.position).add(_v2.set(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(2500,5000))).clone();
          n.t=rnd(6,12);
        }
        desired=n.patrol;thrust=0.5;
      }
    }
    if(desired){
      steerToward(n,desired,dt);
      n.obj.position.addScaledVector(npcForward(n,_v1),n.def.speed*thrust*wdt);
    }
  }
  G.hostiles=NPCS.some(n=>(n.kind==='pirate')||(n.kind==='missile'&&n.target==='player')||(n.kind==='police'&&isWanted())||n.state==='hostile');
}

const isWanted=()=>G.cmdr.legal>=32;

function damageNPC(n,dmg,byPlayer,mine){
  n.hp-=dmg;
  if(n.kind==='trader'&&byPlayer&&!n.attacked){n.attacked=true;G.cmdr.legal+=8;msg('ATTACKING CLEAN VESSEL — OFFENCE LOGGED',cssVar('--rd'));}
  if(n.kind==='police'&&byPlayer){n.state='hostile';G.cmdr.legal+=15;}
  if(n.kind==='pirate'||n.state==='hostile')n.attacked=true;
  if(n.hp<=0)killNPC(n,mine?'mining':byPlayer);
  else Snd.hit();
}

/* ---------------- combat: player weapons ---------------- */
function firePlayerLaser(dt){
  const L=LASERS[G.cmdr.laser];
  G.fireT-=dt;
  if(!G.fireHeld||G.fireT>0)return;
  if(G.laserTemp>=98){msg('LASER OVERHEATED');Snd.err();G.fireT=0.4;return;}
  G.fireT=1/L.rate;
  G.laserTemp=Math.min(100,G.laserTemp+L.heat);
  Snd.laser(G.cmdr.laser);
  // hitscan: nearest ship/asteroid near the crosshair, with mild aim assist
  npcForward({obj:camera},_v1);   // camera forward
  let best=null,bestD=6500;
  for(const n of NPCS){
    if(n.kind==='canister'||n.kind==='splinter')continue;
    _v2.copy(n.obj.position).sub(camera.position);
    const d=_v2.length();
    if(d>6500||d<20)continue;
    _v2.normalize();
    const sz=(n.def&&n.def.size)?n.def.size:30;
    const coneAng=Math.max(0.028,(sz*2.4)/d);    // angular radius incl. assist
    if(_v1.dot(_v2)>Math.cos(coneAng)&&d<bestD){best=n;bestD=d;}
  }
  const hitPoint=best?best.obj.position.clone()
    :_v3.copy(camera.position).addScaledVector(_v1,4000);
  spawnPlayerBeams(L.color,hitPoint);
  if(best){
    const dmg=best.kind==='asteroid'?L.dmg*L.mine:L.dmg;
    damageNPC(best,dmg,true,G.cmdr.laser==='mining'&&best.kind==='asteroid');
  }
}

function updateLock(dt){
  // auto-lock: hostile-ish ship near crosshair for 0.8s
  npcForward({obj:camera},_v1);
  let cand=null,bestDot=0.985;
  for(const n of NPCS){
    if(n.kind==='canister'||n.kind==='splinter'||n.kind==='missile'||n.kind==='asteroid')continue;
    _v2.copy(n.obj.position).sub(camera.position);
    const d=_v2.length();
    if(d>8000)continue;
    const dot=_v1.dot(_v2.normalize());
    if(dot>bestDot){cand=n;bestDot=dot;}
  }
  const lb=$('lockbox');
  if(G.lock.target&&!NPCS.includes(G.lock.target))G.lock.target=null;
  if(G.lock.target){
    // keep lock while roughly in view
    _v2.copy(G.lock.target.obj.position).sub(camera.position);
    if(_v2.length()>9500||_v1.dot(_v2.normalize())<0.55)G.lock.target=null;
  }
  if(!G.lock.target){
    if(cand){
      G.lock.timer+=dt;
      lb.className='locking';
      if(G.lock.timer>0.8){
        G.lock.target=cand;Snd.lockOn();
        msg('TARGET LOCK: '+cand.def.label);
      }
    }else{G.lock.timer=0;lb.className='';}
  }
  if(G.lock.target){
    lb.className='locked';
    // project to screen
    _v2.copy(G.lock.target.obj.position).project(camera);
    if(_v2.z<1){
      lb.style.left=(( _v2.x+1)/2*100)+'%';
      lb.style.top=((-_v2.y+1)/2*100)+'%';
    }
  }else{
    lb.style.left='50%';lb.style.top='50%';
  }
}

function fireMissile(){
  if(G.cmdr.missiles<=0){msg('NO MISSILES');Snd.err();return;}
  if(!G.lock.target){msg('NO TARGET LOCK');Snd.err();return;}
  G.cmdr.missiles--;
  const m=spawnNPC('missile','missile',
    _v1.copy(camera.position).addScaledVector(npcForward({obj:camera},_v2),60).clone(),
    {target:G.lock.target,speed:SHIPS.missile.speed,hp:1,color:COLORS.missile});
  m.t=16;
  m.obj.quaternion.copy(camera.quaternion);
  Snd.jump();
}

function triggerECM(){
  if(!G.cmdr.equip.ecm){msg('NO E.C.M. FITTED');Snd.err();return;}
  if(G.energy<60){msg('ENERGY LOW');Snd.err();return;}
  G.energy-=60;
  Snd.ecm();
  let n=0;
  for(let i=NPCS.length-1;i>=0;i--){
    if(NPCS[i].kind==='missile'){
      spawnExplosion(NPCS[i].obj.position,20,0xe070ff);
      removeNPC(NPCS[i]);n++;
    }
  }
  msg(n?`E.C.M. — ${n} MISSILE${n>1?'S':''} DESTROYED`:'E.C.M. DISCHARGED');
}

/* ---------------- player damage / death ---------------- */
function damagePlayer(dmg,fromDir){
  npcForward({obj:camera},_v1);
  const fore=fromDir.dot(_v1)>0;   // hit came from ahead
  let rem=dmg;
  if(fore){const a=Math.min(G.shieldF,rem);G.shieldF-=a;rem-=a;}
  else{const a=Math.min(G.shieldA,rem);G.shieldA-=a;rem-=a;}
  if(rem>0)G.energy-=rem*4;
  Snd.playerHit();
  const fl=$('flash');
  fl.style.transition='none';fl.style.opacity='1';
  requestAnimationFrame(()=>{fl.style.transition='opacity .45s';fl.style.opacity='0';});
  if(G.energy<=0)die();
}

function die(){
  if(G.mode==='dead')return;
  spawnExplosion(camera.position,60,0x63e6f2);
  Snd.explosion(true);
  if(G.cmdr.equip.pod){
    G.cmdr.equip.pod=false;
    G.cmdr.cargo.fill(0);
    G.cmdr.missionCargo=0;
    // the pod carries no freight and no passengers — those contracts are void
    for(const m of [...G.cmdr.missions])
      if(m.type==='cargo'||m.type==='vip')G.cmdr.missions.splice(G.cmdr.missions.indexOf(m),1);
    G.cmdr.missiles=0;
    G.cmdr.days+=2;
    G.cmdr.system=G.cmdr.lastStation;
    msg('ESCAPE POD EJECTED');
    G.sys=GALAXY[G.cmdr.system];
    G.mode='ejecting';   // inert; main loop ignores this mode
    // the pod is towed to a real station, so every deep-space state must clear:
    // leaving G.witch set would spawn Thargoids in civilised space and turn the
    // next HYPER into a free, fuel-less escape jump
    G.witch=null;G.hyper=null;G.bossT=0;G.warp=false;G.lock.target=null;
    $('hyperct').classList.add('hidden');
    G.energy=400;G.shieldF=G.shieldA=100;G.laserTemp=0;G.cabinHeat=0;
    Snd.engine(0);
    setTimeout(()=>{
      buildSystemScene(G.sys);
      dock();
      G.dockLog.unshift('ESCAPE POD RECOVERED. SHIP REPLACED BY INSURANCE. CARGO AND MISSILES LOST.');
      renderTab('status');
    },1200);
  }else{
    G.mode='dead';
    Snd.engine(0);
    setTimeout(showGameOver,1400);
  }
}

/* ---------------- spawning director ---------------- */
function spawnDirector(dt){
  G.spawnT-=dt;
  if(G.spawnT>0)return;
  G.spawnT=rnd(9,15);
  // witchspace: nothing lives here but Thargoids
  if(G.witch){
    const thg=NPCS.filter(n=>n.key==='thargoid').length;
    if(thg<2&&Math.random()<0.4){
      const p=new THREE.Vector3().randomDirection().multiplyScalar(rnd(6000,9000)).add(camera.position);
      spawnNPC('pirate','thargoid',p,{state:'attack',color:0x7dff9b});
      msg('THARGOID REINFORCEMENT',cssVar('--rd'));Snd.warning();
    }
    return;
  }
  const ships=NPCS.filter(n=>['pirate','trader','police'].includes(n.kind)).length;
  const hostileCount=NPCS.filter(n=>n.kind==='pirate').length;
  const asts=NPCS.filter(n=>n.kind==='asteroid').length;
  const gov=G.sys.gov;
  const nearStation=W.station&&camera.position.distanceTo(W.station.position)<14000;
  // ambient station traffic: freighters launching and docking
  if(W.station&&camera.position.distanceTo(W.station.position)<26000&&Math.random()<0.45){
    const traffic=NPCS.filter(n=>n.traffic).length;
    if(traffic<2&&ships<7){
      const axis=stationAxis(_v1);
      const slot=slotCenter(_v2);
      const key=pick(['adder','cobra','python']);
      if(Math.random()<0.5){
        const t=spawnNPC('trader',key,slot.clone().addScaledVector(axis,320),{});
        t.traffic='out';
        t.away=slot.clone().addScaledVector(axis,9000)
          .add(new THREE.Vector3().randomDirection().multiplyScalar(2500));
        _m1.lookAt(t.obj.position,t.away,UP);
        t.obj.quaternion.setFromRotationMatrix(_m1);
      }else{
        const p=slot.clone().addScaledVector(axis,rnd(7000,10000))
          .add(new THREE.Vector3().randomDirection().multiplyScalar(1800));
        const t=spawnNPC('trader',key,p,{});
        t.traffic='in';
      }
    }
  }
  const spawnPos=()=>{
    npcForward({obj:camera},_v1);
    return _v1.multiplyScalar(rnd(6500,9500))
      .add(_v2.set(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(2000,5200)))
      .add(camera.position).clone();
  };
  // pirates: common in low-gov systems, drawn to full holds
  const cargoLure=cargoUsed(G.cmdr)/G.cmdr.cargoCap*0.10;
  const pirateP=(nearStation?0.35:1)*((8-gov)/30+cargoLure);
  if((G.grace||0)<=0&&hostileCount<=1&&ships<7&&Math.random()<pirateP){
    const vet=G.cmdr.kills>=16;   // encounters scale with combat rating
    const pack=irnd(1,vet?(gov<3?3:2):2);
    const pool=vet?['sidewinder','krait','mamba','adder','cobra']:['sidewinder','krait','adder','sidewinder'];
    if(vet&&gov<4&&Math.random()<0.3)pool.push('asp','asp');
    if(vet&&Math.random()<0.08)pool.push('python');
    for(let k=0;k<pack;k++){
      const key=pick(pool);
      spawnNPC('pirate',key,spawnPos(),{state:'attack',hasEcm:key==='asp'&&Math.random()<0.5});
    }
    msg(pack>1?`${pack} HOSTILES ON SCANNER`:'HOSTILE ON SCANNER',cssVar('--rd'));
    Snd.warning();
    return;
  }
  if(ships<7&&Math.random()<0.16){
    spawnNPC('trader',pick(['adder','cobra','python','python','anaconda']),spawnPos());
    return;
  }
  if(nearStation&&ships<7&&(gov>=5||isWanted())&&Math.random()<(isWanted()?0.75:0.25)){
    spawnNPC('police','viper',spawnPos(),isWanted()?{state:'hostile'}:{});
    if(isWanted()){msg('POLICE VIPER — WEAPONS FREE',cssVar('--rd'));Snd.warning();}
    return;
  }
  if(asts<6&&!nearStation&&Math.random()<0.3){
    const base=spawnPos();
    const k=irnd(1,3);
    for(let i=0;i<k;i++){
      const r=rnd(70,190);
      const a=spawnNPC('asteroid',null,_v1.copy(base).add(_v2.set(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(1500)).clone(),{r,hp:24+r*0.3});
      a.def={size:r,hp:a.hp};
      a.drift=new THREE.Vector3(rnd(-9,9),rnd(-9,9),rnd(-9,9));
    }
  }
}

/* ---------------- hyperspace / witchspace / galactic jump ---------------- */
function startHyperspace(){
  const c=G.cmdr;
  if(G.hyper)return;
  // witchspace escape: the jump was already paid for — burn out to the intended system
  if(G.witch){
    G.hyper={target:G.witch.target,count:4,t:0.9,phase:'count',escape:true};
    $('hyperct').textContent='ESCAPE JUMP';
    $('hyperct').classList.remove('hidden');
    Snd.warning();
    return;
  }
  // armed galactic hyperdrive takes priority over a plotted course
  if(c.galArmed&&c.equip.galdrive){
    G.hyper={galactic:true,count:4,t:0.9,phase:'count'};
    $('hyperct').textContent='GALACTIC JUMP';
    $('hyperct').classList.remove('hidden');
    Snd.warning();
    return;
  }
  const tgt=c.target;
  if(tgt===undefined||tgt===null||tgt===c.system){msg('NO COURSE SET — USE STATION CHARTS');Snd.err();return;}
  const d=distLY(GALAXY[c.system],GALAXY[tgt]);
  if(d>c.fuel){msg(`RANGE ${d.toFixed(1)} LY EXCEEDS FUEL (${c.fuel.toFixed(1)} LY)`);Snd.err();return;}
  G.hyper={target:tgt,count:4,t:0.9,phase:'count'};
  $('hyperct').textContent='HYPERSPACE';
  $('hyperct').classList.remove('hidden');
  Snd.warning();
}
function updateHyperspace(dt){
  const h=G.hyper;
  if(!h)return;
  if(h.phase==='count'){
    h.t-=dt;
    if(h.t<=0){
      h.count--;h.t=1;
      if(h.count>0){$('hyperct').textContent=h.count;Snd.tone(700,0.1,'square',0.2);}
      else{
        $('hyperct').textContent='';$('hyperct').classList.add('hidden');
        h.phase='tunnel';h.t=h.galactic?3.4:2.1;
        G.mode='hyper';
        Snd.hyper();
        startHyperFX();
      }
    }
  }else if(h.phase==='tunnel'){
    h.t-=dt;
    camera.position.addScaledVector(npcForward({obj:camera},_v1),9000*dt);
    if(h.t<=0){
      stopHyperFX();
      const c=G.cmdr;
      G.hyper=null;
      G.mode='flight';
      statsOf(c).jumps++;
      if(h.galactic){
        c.equip.galdrive=false;c.galArmed=false;
        c.galaxy=(c.galaxy%8)+1;
        buildGalaxy(c.galaxy);
        c.days=Math.round((c.days+2)*10)/10;
        c.target=null;G.witch=null;
        enterSystem(c.system,true);
        msg(`INTERGALACTIC TRANSIT COMPLETE — GALAXY ${c.galaxy}`,cssVar('--am'));
        checkAchs();
        return;
      }
      if(h.escape){
        G.witch=null;
        c.witchEscapes=(c.witchEscapes||0)+1;
        c.days=Math.round((c.days+0.5)*10)/10;
        enterSystem(h.target,true);
        checkAchs();
        return;
      }
      const d=distLY(GALAXY[c.system],GALAXY[h.target]);
      c.fuel=Math.round((c.fuel-d)*10)/10;
      c.days=Math.round((c.days+1+d*0.3)*10)/10;
      c.legal=Math.max(0,c.legal-3);
      c.target=null;
      // witchspace misjump — the void between the stars, and something is waiting
      if(d>2&&Math.random()<0.07){
        enterWitchspace(h.target);
        return;
      }
      enterSystem(h.target,true);
    }
  }
}
function cancelHyper(){
  if(G.hyper&&G.hyper.phase==='count'){
    G.hyper=null;
    $('hyperct').classList.add('hidden');
  }
}

function enterWitchspace(target){
