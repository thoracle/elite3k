/* ---------------- flight update ---------------- */
function updateFlight(dt){
  const c=G.cmdr;
  const wdt=dt*(G.warp?WARP_MULT:1);
  if(G.grace>0)G.grace-=dt;
  // arrival grace also ends early if the player opens fire
  if(G.fireHeld)G.grace=0;
  // the Constrictor uncloaks
  if(G.bossT>0){
    G.bossT-=dt;
    if(G.bossT<=0){
      npcForward({obj:camera},_v1);
      const p=_v1.multiplyScalar(8500).add(camera.position).clone();
      spawnNPC('pirate','constrictor',p,{state:'attack',hasEcm:true,color:0xe070ff});
      msg('WARNING: CONSTRICTOR SIGNATURE DETECTED',cssVar('--rd'));
      Snd.warning();
    }
  }
  // steering
  const iv=G.invertY?-1:1;
  camera.rotateX(G.pitch*iv*maxTurn()*dt);
  camera.rotateZ(-G.roll*maxTurn()*1.15*dt);
  // speed
  const targetSpeed=G.throttle*maxSpd();
  G.speed+=clamp(targetSpeed-G.speed,-220*dt,160*dt);
  camera.position.addScaledVector(npcForward({obj:camera},_v1),G.speed*wdt);
  Snd.engine(G.speed/maxSpd()+(G.warp?0.4:0));
  // world motion
  if(W.station)W.station.rotateZ(0.09*wdt);
  if(W.planet)W.planet.rotation.y+=0.004*wdt;
  if(W.moons)for(const m of W.moons)m.rotation.y+=m.userData.spd*wdt;
  // planet proximity
  const pr=G.sys.radius;
  const pd=camera.position.length();      // planet at origin
  if(pd<pr*1.05){
    _v1.copy(camera.position).normalize();
    camera.position.copy(_v1.multiplyScalar(pr*1.07));
    G.speed=maxSpd()*0.15;G.throttle=0.15;
    damagePlayer(26,_v2.copy(camera.position).normalize().negate());
    msg('ATMOSPHERIC IMPACT — PULL UP',cssVar('--rd'));
  }
  // station proximity: slot corridor docks, hull collides
  const sd=W.station?camera.position.distanceTo(W.station.position):Infinity;
  if(W.station){
  const stR=W.station.userData.R,stD=W.station.userData.D;
  if(sd<stR+120){
    const axis=stationAxis(_v1);                    // station -> planet, out of the slot face
    _v2.copy(camera.position).sub(W.station.position);
    const along=_v2.dot(axis);                      // + on the slot side
    _v3.copy(_v2).addScaledVector(axis,-along);     // lateral offset from slot axis
    const lateral=_v3.length();
    npcForward({obj:camera},_v4);
    const entering=_v4.dot(axis)<-0.5;              // flying toward the face
    const nearHull=Math.abs(along)<stD+40&&lateral<stR+40;
    if(nearHull){
      if(along>0&&lateral<170){
        // inside the docking corridor at the face
        if(entering&&G.speed<maxSpd()*0.5){dock();return;}
        camera.position.copy(W.station.position).addScaledVector(axis,stD+320).add(_v3);
        G.speed=maxSpd()*0.1;G.throttle=Math.min(G.throttle,0.15);
        damagePlayer(8,_v4);
        msg('TOO FAST — REDUCE APPROACH SPEED',cssVar('--am'));
      }else{
        if(along>stD*0.6){
          camera.position.copy(W.station.position).addScaledVector(axis,stD+180)
            .add(_v3.normalize().multiplyScalar(Math.max(lateral,180)));
        }else{
          _v2.normalize();
          camera.position.copy(W.station.position).addScaledVector(_v2,stR+160);
        }
        G.speed=maxSpd()*0.12;G.throttle=Math.min(G.throttle,0.2);
        damagePlayer(18,_v2.normalize().negate());
        msg('STATION COLLISION',cssVar('--rd'));
      }
    }
  }
  }
  // sun heat + solar scooping
  const sund=(W.sun&&!G.witch)?camera.position.distanceTo(W.sun.position):Infinity;
  if(sund<2.3e5){
    const prox=1-sund/2.3e5;
    G.cabinHeat=Math.min(100,G.cabinHeat+prox*prox*34*dt);
    if(c.equip.scoop&&prox>0.25&&c.fuel<7){
      c.fuel=Math.min(7,c.fuel+dt*0.35);
      if(Math.random()<dt*2)msg('FUEL SCOOPING… '+c.fuel.toFixed(1)+' LY');
    }
    if(G.cabinHeat>85&&Math.random()<dt*2){damagePlayer(6,_v1.copy(W.sun.position).sub(camera.position).normalize());msg('CABIN TEMPERATURE CRITICAL',cssVar('--rd'));}
  }else{
    G.cabinHeat=Math.max(0,G.cabinHeat-8*dt);
  }
  // masslock
  G.masslock=(pd<pr*6)||(sd<15000)||G.hostiles;
  if(G.warp&&G.masslock){G.warp=false;msg('MASS LOCK — WARP DISENGAGED');}
  // recharge
  const rr=c.equip.energyUnit?26:13;
  G.energy=Math.min(400,G.energy+rr*dt);
  if(G.energy>120){
    if(G.shieldF<100){const a=Math.min(9*dt,100-G.shieldF);G.shieldF+=a;G.energy-=a*1.5;}
    if(G.shieldA<100){const a=Math.min(9*dt,100-G.shieldA);G.shieldA+=a;G.energy-=a*1.5;}
  }
  G.laserTemp=Math.max(0,G.laserTemp-13*dt);
  // combat systems
  firePlayerLaser(dt);
  updateLock(dt);
  updateNPCs(dt,wdt);
  spawnDirector(dt);
  updateHyperspace(dt);
  // clock creeps during flight
  c.days+=dt*(G.warp?WARP_MULT:1)*0.0018;
}

  if(G.energy<100)warns.push('ENERGY LOW');
  $('warnrow').textContent=warns.join(' · ');
}

/* scanner: classic Elite 3D radar */
const SCAN_RANGE=12000;
function drawScanner(){
  const cv=scanCvs,x=cv.getContext('2d');
  const w=cv.width,h=cv.height;
  x.clearRect(0,0,w,h);
  const cx=w/2,cy=h/2,rx=w*0.46,ry=h*0.40;
  x.strokeStyle='rgba(99,230,242,0.5)';
  x.lineWidth=Math.max(1,w/340);
  x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.stroke();
  x.strokeStyle='rgba(99,230,242,0.16)';
  x.beginPath();x.ellipse(cx,cy,rx*0.62,ry*0.62,0,0,7);x.stroke();
  x.beginPath();x.ellipse(cx,cy,rx*0.3,ry*0.3,0,0,7);x.stroke();
  x.beginPath();x.moveTo(cx-rx,cy);x.lineTo(cx+rx,cy);
  x.moveTo(cx,cy-ry);x.lineTo(cx,cy+ry);
  x.moveTo(cx-rx*0.72,cy-ry*0.72);x.lineTo(cx+rx*0.72,cy+ry*0.72);
  x.moveTo(cx-rx*0.72,cy+ry*0.72);x.lineTo(cx+rx*0.72,cy-ry*0.72);
  x.stroke();
  if(!G.sys)return;
  _q1.copy(camera.quaternion).invert();
  const drawBlip=(pos,color,square)=>{
    _v1.copy(pos).sub(camera.position);
    const d=_v1.length();
    if(d>SCAN_RANGE)return;
    _v1.applyQuaternion(_q1);
    let gx=_v1.x/SCAN_RANGE, gz=_v1.z/SCAN_RANGE, gy=_v1.y/SCAN_RANGE;
    const px=cx+gx*rx, pz=cy+gz*ry;      // -z (ahead) plots above center
    const stick=-gy*ry*1.5;
    x.strokeStyle=color;x.fillStyle=color;
    x.lineWidth=Math.max(1,w/340);
    x.beginPath();x.moveTo(px,pz);x.lineTo(px,pz+stick);x.stroke();
    const bs=Math.max(2.5,w/110);
    if(square)x.strokeRect(px-bs,pz+stick-bs,bs*2,bs*2);
    else x.fillRect(px-bs*0.7,pz+stick-bs*0.7,bs*1.4,bs*1.4);
  };
  for(const n of NPCS){
    let col='#ffb347';
    if(n.kind==='pirate'||(n.kind==='missile'&&n.target==='player'))col='#ff5470';
    else if(n.kind==='police')col=isWanted()?'#ff5470':'#6ea8ff';
    else if(n.kind==='asteroid')col='#8fa3ad';
    else if(n.kind==='canister'||n.kind==='splinter')col='#63e6f2';
    else if(n.kind==='missile')col='#e070ff';
    drawBlip(n.obj.position,col,false);
  }
  if(W.station)drawBlip(W.station.position,'#ffffff',true);
}

/* compass: points at station (or planet when >60km out) */
function drawCompass(){
  const cv=compCvs,x=cv.getContext('2d');
  const w=cv.width;x.clearRect(0,0,w,w);
  const cx=w/2,r=w*0.42;
  x.strokeStyle='rgba(99,230,242,0.5)';x.lineWidth=Math.max(1,w/64);
  x.beginPath();x.arc(cx,cx,r,0,7);x.stroke();
  if(!W.station)return;
  const sd=camera.position.distanceTo(W.station.position);
  const target=sd>80000?_v2.set(0,0,0):W.station.position;
  const isPlanet=sd>80000;
  _v1.copy(target).sub(camera.position).normalize().applyQuaternion(_q1.copy(camera.quaternion).invert());
  const px=cx+_v1.x*r*0.82, py=cx-_v1.y*r*0.82;
  const ahead=_v1.z<0;
  x.fillStyle=x.strokeStyle=isPlanet?'#7dff9b':'#ffb347';
  x.beginPath();x.arc(px,py,w*0.09,0,7);
  if(ahead)x.fill();else x.stroke();
}

function applyLoadedCommander(o){
  o.galaxy=o.galaxy||1;o.rep=o.rep||0;o.galArmed=o.galArmed||false;
  if(o.equip.galdrive===undefined)o.equip.galdrive=false;
  o.ship=o.ship||'cobra';
  if(!o.story)o.story={stage:0,sys:null,gal:0,killed:false};
  if(!o.stats)o.stats={earned:0,jumps:0,visited:{},scooped:0,missionsDone:0};
  if(!o.ach)o.ach=[];
  if(CURRENT_GALAXY!==o.galaxy)buildGalaxy(o.galaxy);
  G.cmdr=o;
  G.sys=GALAXY[o.system];
  enterSystem(o.system,false);
  dock();
  G.dockLog.unshift(`COMMANDER ${o.name} RESTORED`);
  renderTab('status');
}

/* trade-route analyzer: best single-leg profit within fuel range */
function renderRoutes(){
  const el=$('routes');if(!el)return;
  const c=G.cmdr,cur=GALAXY[c.system];
  const out=[];
  for(const s of GALAXY){
    if(s.i===c.system)continue;
    const d=distLY(cur,s);
    if(d>c.fuel)continue;
    const there=marketFor(s.i,c.days+1+d*0.3);
    let best=null;
    for(const row of G.mkt){
      if(row.qty<=0)continue;
      const profit=there[row.ci].price-row.price;
      if(profit>0.5&&(!best||profit>best.profit))best={ci:row.ci,profit};
    }
    if(best)out.push({s,d,...best});
  }
  out.sort((a,b)=>b.profit-a.profit);
  if(!out.length){el.innerHTML='<div class="note">No profitable routes within fuel range — refuel or relocate.</div>';return;}
  el.innerHTML='<h3>BEST ROUTES FROM '+cur.name+'</h3>'+out.slice(0,6).map(r=>
    `<div class="msrow" data-rt="${r.s.i}" style="cursor:pointer">${r.s.name} — ${r.d.toFixed(1)} LY · buy <b>${COMMODITIES[r.ci].name}</b>
     → <span class="rw">+${r.profit.toFixed(1)} CR/T</span> (est.)</div>`).join('')+
    '<div class="note">Estimates use current prices and arrival-day markets. Tap a route to select it.</div>';
  el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{
    chartSel=+b.dataset.rt;Snd.click();drawChart();renderSysInfo();
  });
}

/* ---------------- galaxy chart ---------------- */
let chartMode='local',chartSel=null;
function sizeChart(){
  const cv=$('chart');if(!cv)return;
  const r=cv.parentElement.getBoundingClientRect();
  const wCss=Math.min(r.width-4,980);
  const hCss=Math.min(innerHeight*0.52,wCss*0.55);
  cv.style.width=wCss+'px';
  cv.style.height=hCss+'px';
  cv.style.margin='0 auto';
  cv.width=Math.round(wCss*devicePixelRatio);
  cv.height=Math.round(hCss*devicePixelRatio);
}
function chartTransform(){
  const cv=$('chart');
  const cur=GALAXY[G.cmdr.system];
  if(chartMode==='galaxy'){
    const sx=cv.width/262,sy=cv.height/134;
    return {fx:s=>(s.x+3)*sx,fy:s=>(s.y+3)*sy,r:Math.max(2,cv.width/300)};
  }
  const span=36;   // LY visible
  const scale=Math.min(cv.width,cv.height*1.9)/(span/0.4);
  return {fx:s=>cv.width/2+(s.x-cur.x)*scale,fy:s=>cv.height/2+(s.y-cur.y)*scale,
    r:Math.max(3,cv.width/210),scale};
}
function drawChart(){
  const cv=$('chart');if(!cv||!G.cmdr)return;
  const x=cv.getContext('2d');
  x.clearRect(0,0,cv.width,cv.height);
  const T=chartTransform();
  const cur=GALAXY[G.cmdr.system];
  // fuel range ring (local mode)
  if(chartMode==='local'){
    x.strokeStyle='rgba(255,179,71,0.5)';
    x.setLineDash([6,5]);x.lineWidth=Math.max(1,cv.width/500);
    x.beginPath();
    x.arc(T.fx(cur),T.fy(cur),(G.cmdr.fuel/0.4)*T.scale,0,7);
    x.stroke();x.setLineDash([]);
  }
  const fs=Math.max(8,cv.width/64);
  x.font=fs+'px ui-monospace,monospace';
  x.textAlign='center';
  for(const s of GALAXY){
    const px=T.fx(s),py=T.fy(s);
    if(px<-20||py<-20||px>cv.width+20||py>cv.height+20)continue;
    x.fillStyle='#'+new THREE.Color(s.color).getHexString();
    x.beginPath();x.arc(px,py,T.r,0,7);x.fill();
    if(chartMode==='local'){
      x.fillStyle='rgba(99,230,242,0.75)';
      x.fillText(s.name,px,py-T.r-3);
    }
  }
  // current system marker
  x.strokeStyle='#fff';x.lineWidth=Math.max(1,cv.width/400);
  const cx=T.fx(cur),cy=T.fy(cur),ch=T.r*3;
  x.beginPath();x.moveTo(cx-ch,cy);x.lineTo(cx+ch,cy);x.moveTo(cx,cy-ch);x.lineTo(cx,cy+ch);x.stroke();
  // course target
  const tgt=G.cmdr.target;
  if(tgt!==undefined&&tgt!==null){
    const s=GALAXY[tgt];
    x.strokeStyle='#ffb347';
    x.beginPath();x.arc(T.fx(s),T.fy(s),T.r*2.4,0,7);x.stroke();
    x.setLineDash([4,4]);
    x.beginPath();x.moveTo(cx,cy);x.lineTo(T.fx(s),T.fy(s));x.stroke();x.setLineDash([]);
  }
  // selection
  if(chartSel!==null){
    const s=GALAXY[chartSel];
    x.strokeStyle='#63e6f2';
    x.strokeRect(T.fx(s)-T.r*2.6,T.fy(s)-T.r*2.6,T.r*5.2,T.r*5.2);
  }
}
function chartTap(ev){
  const cv=$('chart');
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)*(cv.width/r.width),py=(ev.clientY-r.top)*(cv.height/r.height);
  const T=chartTransform();
  let best=null,bd=(cv.width/16)**2;
  for(const s of GALAXY){
    const d=(T.fx(s)-px)**2+(T.fy(s)-py)**2;
    if(d<bd){bd=d;best=s;}
  }
  if(best){chartSel=best.i;Snd.click();drawChart();renderSysInfo();}
}
function renderSysInfo(){
  const el=$('sysinfo');if(!el)return;
  if(chartSel===null){el.innerHTML='<span class="note">Tap a system for data.</span>';return;}
  const s=GALAXY[chartSel];
  const d=distLY(GALAXY[G.cmdr.system],s);
  const inRange=d<=G.cmdr.fuel;
  const isCur=chartSel===G.cmdr.system;
  el.innerHTML=`<b>${s.name}</b> — ${d.toFixed(1)} LY<br>
    ${ECONOMIES[s.economy]} · ${GOVERNMENTS[s.gov]} · TECH ${s.tech} · POP ${s.pop} BN<br>
    <span class="note">${s.desc}</span><br>
    ${isCur?'<span class="note">— PRESENT SYSTEM —</span>':
      `<button class="tbtn" id="setCourse" ${inRange?'':'disabled'}>${inRange?'SET COURSE':'OUT OF RANGE'}</button>`}`;
  const b=$('setCourse');
  if(b)b.onclick=()=>{
    G.cmdr.target=chartSel;Snd.lockOn();
    msg('COURSE LAID IN: '+s.name);
    drawChart();
  };
}

const KEYS=new Set();
function initInput(){
  const isTyping=t=>!!t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  addEventListener('keydown',e=>{
    Snd.ensure();Snd.resume();Music.ensure();
    // leave the commander-name field and the transfer-code box alone, or Space
    // and the arrow keys get swallowed before they can be typed
    if(isTyping(e.target))return;
    if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if(!e.repeat)keyAction(e.code);
    KEYS.add(e.code);
  });
  addEventListener('keyup',e=>KEYS.delete(e.code));
  addEventListener('blur',()=>{KEYS.clear();G.fireHeld=false;});
  addEventListener('contextmenu',e=>{if(e.target.tagName!=='TEXTAREA'&&e.target.tagName!=='INPUT')e.preventDefault();});
  // reveal touch controls on first touch
  addEventListener('pointerdown',e=>{
    Snd.ensure();Snd.resume();Music.ensure();
    if(e.pointerType==='touch')document.body.classList.remove('notouch');
    if(Tilt.want&&!Tilt.on)enableTilt();   // iOS permission needs a gesture
  },{capture:true});
  if(navigator.maxTouchPoints>0)document.body.classList.remove('notouch');
  addEventListener('mousemove',e=>{
    Mouse.x=(e.clientX/innerWidth-0.5)*2;
    Mouse.y=(e.clientY/innerHeight-0.5)*2;
  });
  initTouch();
}

/* mouse steering (optional, desktop): ship turns toward the cursor */
const Mouse={on:LS.get('e3k.mouse')==='1',x:0,y:0};
function mouseAxis(v){
  const dz=0.09,span=0.5;
  const a=Math.abs(v);
  if(a<dz)return 0;
  return Math.sign(v)*Math.min(1,(a-dz)/span);
}

/* tilt assist (optional, mobile): gyro fine-steering on top of the stick */
const Tilt={on:false,listening:false,base:null,pitch:0,roll:0,
  want:LS.get('e3k.tilt')==='1'};
async function enableTilt(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted'){LS.set('e3k.tilt','0');Tilt.want=false;return false;}
    }
    if(!Tilt.listening){
      addEventListener('deviceorientation',e=>{
        if(e.beta==null||!Tilt.on)return;
        if(!Tilt.base)Tilt.base={b:e.beta,g:e.gamma};
        const db=e.beta-Tilt.base.b, dg=e.gamma-Tilt.base.g;
        const ang=(screen.orientation&&screen.orientation.angle)||0;
        let p,r;
        if(ang===90){p=-dg;r=db;}
        else if(ang===270||ang===-90){p=dg;r=-db;}
        else{p=db;r=dg;}
        Tilt.pitch=clamp(p/26,-0.65,0.65);   // tilt back = nose up
        Tilt.roll=clamp(r/26,-0.65,0.65);
      });
      Tilt.listening=true;
    }
    Tilt.on=true;Tilt.base=null;Tilt.want=true;
    LS.set('e3k.tilt','1');
    return true;
  }catch(_){return false;}
}
function disableTilt(){
  Tilt.on=false;Tilt.want=false;Tilt.pitch=Tilt.roll=0;
  LS.set('e3k.tilt','0');
}

function keyAction(code){
  if(G.mode==='title')return;
  if(code==='KeyP'||code==='Escape'){
    if(G.paused){G.paused=false;hideOverlay();}
    else if(G.mode==='flight'||G.mode==='hyper')showPause();
    return;
  }
  if(G.paused||G.mode!=='flight')return;
  switch(code){
    case 'KeyM':fireMissile();break;
    case 'KeyE':triggerECM();break;
    case 'KeyJ':toggleWarp();break;
    case 'KeyH':G.hyper?cancelHyper():startHyperspace();break;
    case 'KeyC':tryAutoDock();break;
    case 'KeyL':cycleLaser();break;
  }
}
function toggleWarp(){
  if(G.warp){G.warp=false;msg('WARP DISENGAGED');return;}
  if(G.masslock){msg(G.hostiles?'WARP BLOCKED — HOSTILES':'WARP BLOCKED — MASS LOCK');Snd.err();return;}
  G.warp=true;msg('WARP ×'+WARP_MULT+' ENGAGED');Snd.jump();
}
function cycleLaser(){
  const owned=Object.keys(G.cmdr.lasers).filter(k=>G.cmdr.lasers[k]);
  if(owned.length<2){msg(LASERS[G.cmdr.laser].name);return;}
  const i=(owned.indexOf(G.cmdr.laser)+1)%owned.length;
  G.cmdr.laser=owned[i];
  msg('ACTIVE: '+LASERS[G.cmdr.laser].name);
  Snd.click();
}

function pollKeys(dt){
  let pitch=0,roll=0;
  // W/up raises the nose, matching the touch stick and mouse steering; the
  // INVERT PITCH setting flips all three together for flight-sim habits
  if(KEYS.has('KeyW')||KEYS.has('ArrowUp'))pitch+=1;     // nose up
  if(KEYS.has('KeyS')||KEYS.has('ArrowDown'))pitch-=1;   // nose down
  if(KEYS.has('KeyD')||KEYS.has('ArrowRight'))roll+=1;
  if(KEYS.has('KeyA')||KEYS.has('ArrowLeft'))roll-=1;
  if(KEYS.has('KeyR'))G.throttle=clamp(G.throttle+dt*0.7,0,1);
  if(KEYS.has('KeyF'))G.throttle=clamp(G.throttle-dt*0.7,0,1);
  if(KEYS.has('ShiftLeft')||KEYS.has('ShiftRight'))G.throttle=1;
  if(KEYS.has('ControlLeft')||KEYS.has('ControlRight'))G.throttle=0;
  // merge with touch stick, mouse steering, tilt assist
  pitch+=Touch.stickY;
  roll+=Touch.stickX;
  if(Mouse.on){pitch+=-mouseAxis(Mouse.y);roll+=mouseAxis(Mouse.x);}
  if(Tilt.on){pitch+=Tilt.pitch;roll+=Tilt.roll;}
  G.pitch=clamp(pitch,-1,1);
  G.roll=clamp(roll,-1,1);
  G.fireHeld=KEYS.has('Space')||Touch.fire;
}

/* ---------------- input: touch ---------------- */
const Touch={stickId:null,ox:0,oy:0,stickX:0,stickY:0,fire:false,thrId:null};
function initTouch(){
  const zone=$('stickzone'),base=$('stickbase'),nub=$('sticknub');
  zone.addEventListener('pointerdown',e=>{
    if(Touch.stickId!==null)return;
    Touch.stickId=e.pointerId;
    try{zone.setPointerCapture(e.pointerId)}catch(_){};
    Touch.ox=e.clientX;Touch.oy=e.clientY;
    base.style.left=nub.style.left=e.clientX+'px';
    base.style.top=nub.style.top=e.clientY+'px';
    base.style.opacity=nub.style.opacity='1';
  });
  zone.addEventListener('pointermove',e=>{
    if(e.pointerId!==Touch.stickId)return;
    const dx=clamp((e.clientX-Touch.ox)/52,-1,1);
    const dy=clamp((e.clientY-Touch.oy)/52,-1,1);
    Touch.stickX=dx;Touch.stickY=-dy;    // push up = nose up
    nub.style.left=(Touch.ox+dx*52)+'px';
    nub.style.top=(Touch.oy+dy*52)+'px';
  });
  const stickEnd=e=>{
    if(e.pointerId!==Touch.stickId)return;
    Touch.stickId=null;Touch.stickX=Touch.stickY=0;
    base.style.opacity=nub.style.opacity='0';
  };
  zone.addEventListener('pointerup',stickEnd);
  zone.addEventListener('pointercancel',stickEnd);

  const thr=$('throttle');
  const thrSet=e=>{
    const r=thr.getBoundingClientRect();
    G.throttle=clamp(1-(e.clientY-r.top)/r.height,0,1);
  };
  thr.addEventListener('pointerdown',e=>{Touch.thrId=e.pointerId;try{thr.setPointerCapture(e.pointerId)}catch(_){};thrSet(e);});
  thr.addEventListener('pointermove',e=>{if(e.pointerId===Touch.thrId)thrSet(e);});
  const thrEnd=e=>{if(e.pointerId===Touch.thrId)Touch.thrId=null;};
  thr.addEventListener('pointerup',thrEnd);
  thr.addEventListener('pointercancel',thrEnd);

  const fb=$('firebtn');
  fb.addEventListener('pointerdown',e=>{Touch.fire=true;try{fb.setPointerCapture(e.pointerId)}catch(_){};});
  const fEnd=()=>Touch.fire=false;
  fb.addEventListener('pointerup',fEnd);
  fb.addEventListener('pointercancel',fEnd);

  const act=(id,fn)=>$(id).addEventListener('click',()=>{if(G.mode==='flight'&&!G.paused)fn();});
  act('bMsl',fireMissile);
  act('bEcm',triggerECM);
  act('bJmp',toggleWarp);
  act('bHyp',()=>G.hyper?cancelHyper():startHyperspace());
  act('bDock',tryAutoDock);
  $('bPause').addEventListener('click',()=>{
    if(G.paused){G.paused=false;hideOverlay();}
    else if(G.mode==='flight'||G.mode==='hyper')showPause();
  });
}

/* ---------------- main loop ---------------- */
// ?headless=1 : drive the loop via MessageChannel so automated tests run in background tabs
const HEADLESS=location.search.includes('headless');
if(HEADLESS){
  const mc=new MessageChannel();
  let q=[],scheduled=false;
  mc.port1.onmessage=()=>{
    scheduled=false;
    const batch=q;q=[];
    const t=performance.now();
    for(const f of batch)f(t);
  };
  window.requestAnimationFrame=f=>{
    q.push(f);
    if(!scheduled){scheduled=true;mc.port2.postMessage(0);}
    return 0;
  };
}
let lastT=performance.now(),fpsAcc=0,fpsN=0,fpsDone=false,elapsed=0;

let idleAcc=0;
/* The station UI and the pause overlay cover the 3D view almost completely,
   so re-rendering it at display rate is pure battery burn on a phone. Drop to
   ~8fps for the sliver that shows through. */
function renderThrottled(dt){
  const covered=G.paused||G.mode==='docked'||G.mode==='ejecting';
  if(!covered){idleAcc=0;renderFrame();return;}
  idleAcc+=dt;
  if(idleAcc>=0.125){idleAcc=0;renderFrame();}
}

function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  if(G.paused){renderThrottled(dt);return;}
  elapsed+=dt;

  if(G.mode==='title'){
    if(W.titleShip){
      W.titleShip.rotation.y+=dt*0.45;
      W.titleShip.rotation.x=Math.sin(elapsed*0.3)*0.25;
    }
  }
  else if(G.mode==='flight'){
    pollKeys(dt);
    updateFlight(dt);
    if(G.mode==='flight'){          // may have docked/died this frame
      updateHud();
      drawScanner();
      drawCompass();
      $('throttle').firstElementChild.style.height=(G.throttle*100).toFixed(0)+'%';
    }
  }
  else if(G.mode==='hyper'){
    updateHyperspace(dt);
    updateHyperFX(dt);
    updateHud();
  }
  else if(G.mode==='autodock'){
    updateAutodock(dt);
    updateNPCs(dt,dt);
    updateHud();
    drawScanner();
  }
  else if(G.mode==='dead'){
    // drift among the wreckage
  }

  if(W.stars)W.stars.position.copy(camera.position);
  updateTransients(dt);
  renderThrottled(dt);

  // auto-disable bloom on weak GPUs (first 12 s sample)
  if(!fpsDone&&G.mode!=='title'){
    fpsAcc+=dt;fpsN++;
    if(fpsAcc>12){
      fpsDone=true;
      const avg=fpsN/fpsAcc;
      if(avg<32&&bloomOn){setBloom(false);msg('GLOW FX DISABLED FOR PERFORMANCE (STATUS TO RE-ENABLE)');}
    }
  }
}
function renderFrame(){
  if(bloomOn)composer.render();
  else renderer.render(scene,camera);
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&!HEADLESS&&G.mode==='flight'&&!G.paused)showPause();
  lastT=performance.now();
});

/* ---------------- boot ---------------- */
// debug / modding hooks
Object.assign(window,{G,W,SHIPS,LASERS,get NPCS(){return NPCS;},GALAXY,camera:()=>camera,
  DBG:{spawnNPC,damageNPC,killNPC,removeNPC,dock,enterSystem,enterWitchspace,startHyperspace,Music,buildGalaxy,marketFor,distLY,PSHIPS,storyAccept,checkAchs}});
buildGalaxy();
initScene();
initInput();
initTitle();
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{Snd.click();renderTab(b.dataset.tab);}));
toTitle();
fitHudCanvases();
requestAnimationFrame(loop);
// PWA: offline cache + install support (production only — cache-first would mask local dev edits)
if('serviceWorker' in navigator&&location.protocol==='https:')
  navigator.serviceWorker.register('./sw.js').catch(()=>{});

</script>
